{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tutorial.componentName" (list . "expenses") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tutorial.labels" (list . "expenses") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tutorial.selectorLabels" (list . "expenses") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
    - from:
        - podSelector:
            matchLabels:
              {{- include "tutorial.selectorLabels" (list . "agent") | nindent 14 }}
      ports:
        - port: internal
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tutorial.componentName" (list . "agent") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tutorial.labels" (list . "agent") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tutorial.selectorLabels" (list . "agent") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
{{- if include "tutorial.tunnel" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tutorial.componentName" (list . "tunnel") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tutorial.labels" (list . "tunnel") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tutorial.selectorLabels" (list . "tunnel") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "tutorial.selectorLabels" (list . "expenses") | nindent 14 }}
      ports:
        - port: metrics
{{- end }}
{{- end }}
