nameOverride: ""
fullnameOverride: hush-hosted-agent-tutorial

# One image runs both the agent and Expenses.
image:
  repository: public.ecr.aws/z0t8l6o4/hush-hosted-agent-tutorial
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# The Hush gateway the agent works through. Required.
gateway:
  # Its MCP address, as the Hush UI shows it: https://<gateway>/mcp
  url: ""
  # Who issues the gateway's tokens: the agent's Kubernetes token is issued
  # for it (its audience). Read it from the gateway:
  #   curl -s https://<gateway>/.well-known/oauth-protected-resource/mcp
  # and take authorization_servers[0].
  issuer: ""

# A Hush API key, for the tutorial to put Expenses in Hush, to start over, and
# to take Expenses out on uninstall. Create one with the Applications Read
# (applications:read), Applications Write (applications:write), Agents Read
# (agents:read) and Agents Write (agents:write) scopes only, expiring in a few
# hours: long enough to uninstall with, as uninstalling uses it too. Required.
hush:
  apiKey:
    # A Secret you created, with keys `id` and `secret`:
    #   kubectl create secret generic hush-api-key --from-literal=id=... \
    #     --from-literal=secret=...
    # Preferred: the key stays out of your shell history and Helm's release.
    existingSecret: ""
    # Or the key itself.
    id: ""
    secret: ""

agent:
  # Registered in Hush as this service account: the token's subject is
  # system:serviceaccount:<namespace>:<serviceAccount>.
  serviceAccount: expenses-assistant
  # Where your browser reaches the agent's page. The default suits
  # kubectl port-forward; set it when serving the page from elsewhere. The
  # page's buttons work only under this address.
  url: http://localhost:8080
  port: 8080
  # Ask for a username and password before showing the page or taking its
  # actions, for a page others can reach: the name of a Secret in the release's
  # namespace, with keys username and password. Off when empty, as through
  # kubectl port-forward only those with access to the cluster reach it. Serve
  # such a page over HTTPS: the password is otherwise sent in the clear. The
  # agent reads the Secret when it starts: after changing it, run
  #   kubectl rollout restart -n <namespace> deploy/hush-hosted-agent-tutorial-agent
  basicAuth:
    existingSecret: ""
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

expenses:
  # Its name in the Hush catalog; on the gateway it is custom-<name>.
  name: expenses-tutorial
  # Expenses' public HTTPS address, for a load balancer or ingress you set up
  # in front of the expenses Service. The gateway and your browser both reach
  # Expenses there.
  #
  # Left empty, a Cloudflare quick tunnel gives Expenses a random public
  # address under trycloudflare.com instead, and signing in to Expenses asks
  # for an access code the chart generates (the tutorial page shows it). The
  # tunnel's address changes whenever its pod restarts.
  url: ""
  port: 8000
  # What Expenses saw, and its address: for the agent's page only.
  internalPort: 8001
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

# Puts Expenses in Hush with the API key, the only part of the tutorial that
# holds it.
setup:
  # Whether Hush has Expenses: for the agent's page only.
  port: 8002
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

tunnel:
  image: cloudflare/cloudflared:2026.10.7
  # Where Expenses reads the tunnel's address from.
  metricsPort: 2000
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

# Let in only the traffic the tutorial needs: Expenses' log of calls and
# setup's status from the agent only, the tunnel's metrics from Expenses and
# setup only. Takes effect where the cluster's network enforces NetworkPolicy.
networkPolicy:
  enabled: true

# Where the tutorial's pods may run, for example {kubernetes.io/arch: amd64}.
nodeSelector: {}
