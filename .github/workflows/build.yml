# Every push and pull request is tested and built. Pushes to main and to
# *-ci branches also push the commit's image, for trying out unreleased
# changes. On main, the version in Chart.yaml is released (image and chart)
# unless it already is: to release, merge a commit that bumps version and
# appVersion. The first release creates the chart's package on ghcr private:
# make it public by hand, as readers install without logging in.
# Re-running an old run can release a version older than the latest; don't.
name: Build and release

on:
  push:
    branches:
      - main
      - "**-ci"
  pull_request:
  workflow_dispatch:

env:
  HELM_VERSION: v4.3.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Python the image runs.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Test
        run: make test

      - name: Check the chart
        run: make lint

      - name: Build image
        run: make build

  push:
    name: Push
    needs: build
    # The branches the AWS role trusts.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || endsWith(github.ref, '-ci'))
    runs-on: ubuntu-latest
    # One release at a time. While one runs, only the newest waiting run is
    # kept: a skipped run's version bump is still in the newer commit, which
    # then releases it.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      # Lets the amd64 runner build the arm64 half of the images too.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::116981795030:role/github-actions/hush-hosted-agent-tutorial
          aws-region: us-east-1

      - name: Push the commit's image
        run: make submit

      # Before any lookup: without read access ghcr cannot tell whether a
      # version exists, and the release would stop.
      - name: Log in to ghcr
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Check whether this version is released
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          state=$(make -s release-state)
          echo "This version is $state."
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.version.outputs.state == 'unreleased'
        run: make publish
