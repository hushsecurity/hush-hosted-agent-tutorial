<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosted Agent Tutorial</title>
<style>
  /* A step bar on top. "Try the assistant" puts the agent's own app on the left, and on the right what to do, then what each of its calls set off. */
  :root {
    --bg: #ffffff; --surface: #f3f5f9; --surface-2: #e9edf4; --ink: #0d0d26; --text: #33334d; --muted: #5a5a72;
    --faint: #8a8aa0; --line: #e1e4ec; --accent: #4033d6; --accent-soft: #eceaff; --ok: #006b00; --ok-soft: #e2f7e2;
    --deny: #9c2f17; --deny-soft: #fbe7e1; --note: #7a5000; --note-soft: #fff1cc; --code-bg: #0d0d26; --code-ink: #eef0f6;
    /* The assistant's own brand: deliberately not Hush's. */
    --app: #0b7a63; --app-ink: #ffffff; --app-soft: #e3f4ef; --app-bg: #fbfcfc; --app-line: #d6e6e1; --app-text: #1d2b28;
    --app-muted: #5d6f6a; --app-shadow: 0 1px 2px rgb(16 40 34 / 0.06), 0 12px 32px rgb(16 40 34 / 0.12);
    --sans: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b17; --surface: #15152a; --surface-2: #1d1d36; --ink: #f2f2fa; --text: #c8c8db; --muted: #9a9ab4;
      --faint: #6f6f8a; --line: #26263f; --accent: #a9a0ff; --accent-soft: #242050; --ok: #7fe08a; --ok-soft: #12301b;
      --deny: #ff9d86; --deny-soft: #3a1a13; --note: #ffd47a; --note-soft: #362a0f; --code-bg: #05050e; --code-ink: #e6e8f2;
      --app: #3cc9a5; --app-ink: #062a21; --app-soft: #12302a; --app-bg: #101c1a; --app-line: #23403a; --app-text: #e3efec;
      --app-muted: #93aba5; --app-shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px rgb(0 0 0 / 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b17; --surface: #15152a; --surface-2: #1d1d36; --ink: #f2f2fa; --text: #c8c8db; --muted: #9a9ab4;
    --faint: #6f6f8a; --line: #26263f; --accent: #a9a0ff; --accent-soft: #242050; --ok: #7fe08a; --ok-soft: #12301b;
    --deny: #ff9d86; --deny-soft: #3a1a13; --note: #ffd47a; --note-soft: #362a0f; --code-bg: #05050e; --code-ink: #e6e8f2;
    --app: #3cc9a5; --app-ink: #062a21; --app-soft: #12302a; --app-bg: #101c1a; --app-line: #23403a; --app-text: #e3efec;
    --app-muted: #93aba5; --app-shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px rgb(0 0 0 / 0.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { color: var(--ink); margin: 0; line-height: 1.2; text-wrap: balance; }
  p { margin: 0; }
  code { font-family: var(--mono); font-size: 0.86em; color: var(--ink); overflow-wrap: anywhere; }
  button, input, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
  @media (min-width: 640px) { .wrap { padding-inline: 24px; } }

  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 16px; }
  .logo { color: var(--ink); width: 140px; height: 27px; display: block; flex: none; }
  .logo svg { width: 100%; height: 100%; display: block; }
  .product { font-weight: 600; color: var(--ink); padding-left: 16px; border-left: 1px solid var(--line); }

  nav.steps { border-bottom: 1px solid var(--line); background: var(--surface); }
  nav.steps ol { list-style: none; margin: 0; display: flex; gap: 4px; overflow-x: auto; }
  nav.steps button {
    display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; border: 0; background: none; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500;
  }
  nav.steps button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--accent); }
  nav.steps .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink); }
  nav.steps button[aria-current="step"] .n { background: var(--accent); color: var(--bg); }
  nav.steps .done .n { background: var(--ok-soft); color: var(--ok); }

  main .wrap { padding-block: 32px 56px; }
  .layout { display: grid; grid-template-columns: minmax(0, 720px); gap: 40px; }
  .layout.with-app { grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); grid-template-areas: "head head" "app guide" "app behind";
    grid-template-rows: auto auto 1fr; align-items: start; row-gap: 24px; }
  .layout.with-app .story { display: contents; }
  .layout.with-app .app-col { grid-area: app; }
  .layout.with-app .feed-col { grid-area: behind; }
  .try-head { grid-area: head; display: flex; flex-direction: column; gap: 14px; }
  .try-guide { grid-area: guide; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (max-width: 980px) {
    .layout.with-app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "guide" "app" "behind"; grid-template-rows: none; gap: 24px; }
  }
  .story { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .story h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; }
  .story h2 { font-size: 17px; margin-top: 8px; }
  .story p { max-width: 64ch; }
  .tasks { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; counter-reset: task; }
  .tasks > li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; counter-increment: task; }
  .tasks > li::before { content: counter(task); width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); color: var(--ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .points { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .points li { display: flex; gap: 12px; }
  .points li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 9px 4px 0; }

  .fields { border-collapse: collapse; font-size: 13px; width: 100%; }
  .fields th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 12px 8px 0; white-space: nowrap; vertical-align: top; }
  .fields td { padding: 8px 0; width: 100%; }
  .fields tr + tr > * { border-top: 1px solid var(--line); }
  .fields.policies td, .fields.policies thead th { width: auto; padding-right: 12px; }
  .fields.policies thead th { font-size: 12px; border-bottom: 1px solid var(--line); }
  .val { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .val code { min-width: 0; }
  .copy { flex: none; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; cursor: pointer; }
  .copy:hover { border-color: var(--accent); }
  .cmd { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 10px 10px 10px 12px; }
  .cmd code { color: inherit; flex: 1; min-width: 0; white-space: pre-wrap; font-size: 12.5px; }
  .cmd .copy { color: var(--code-ink); background: none; border-color: #3a3a58; }

  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: filter 0.12s, transform 0.12s; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .note { font-size: 13px; color: var(--muted); }
  .spin { flex: none; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .spin { animation-duration: 2.4s; } }

  .result { border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .result > * { display: block; }
  .result > * + * { margin-top: 6px; }
  .result.ok { background: var(--ok-soft); color: var(--ok); }
  .result.wait { background: var(--note-soft); color: var(--note); }
  .result.no { background: var(--deny-soft); color: var(--deny); }
  .result a { color: inherit; font-weight: 600; }
  .result .detail { font-size: 12.5px; opacity: 0.85; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .status.ok { color: var(--ok); }
  .status.wait { color: var(--note); }
  .status.no { color: var(--deny); }
  .warn { font-size: 13px; color: var(--note); background: var(--note-soft); border-radius: 8px; padding: 8px 10px; }
  .aside { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent-soft); padding-left: 12px; }
  .nav-row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }

  /* The story beside the assistant: where the reader is, and what's next. */
  .progress { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; }
  .progress li { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .progress .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); }
  .progress .current { color: var(--ink); font-weight: 600; }
  .progress .current .mark { background: var(--accent); color: var(--bg); }
  .progress .done .mark { background: var(--ok-soft); color: var(--ok); }
  .guide { display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); max-width: 920px; }
  .guide .fields { max-width: 560px; }
  .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .checklist li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 14px; }
  .checklist .tick { width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
  .checklist .yes .tick { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .checklist .why { color: var(--muted); }
  .checklist.inline { flex-direction: row; flex-wrap: wrap; gap: 8px 24px; }

  /* The assistant: the agent's own app, not part of the tutorial. */
  .app-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .app-label { display: flex; align-items: baseline; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .app-label span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .appwin { background: var(--app-bg); color: var(--app-text); border: 1px solid var(--app-line); border-radius: 18px; box-shadow: var(--app-shadow);
    overflow: hidden; font-family: var(--sans); }
  .appwin h3 { color: var(--app-text); }
  .appbar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--app); color: var(--app-ink); }
  .applogo { width: 34px; height: 34px; border-radius: 10px; background: rgb(255 255 255 / 0.18); display: grid; place-items: center; flex: none; }
  .applogo svg { width: 20px; height: 20px; }
  .appname { display: flex; flex-direction: column; line-height: 1.2; }
  .appname b { font-size: 15px; }
  .appname small { font-size: 12px; opacity: 0.8; }
  .appbar .menu { margin-left: auto; position: relative; }
  .appbar summary { list-style: none; cursor: pointer; }
  .appbar summary::-webkit-details-marker { display: none; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700;
    background: var(--app-ink); color: var(--app); }
  .menu-pop { position: absolute; right: 0; top: 42px; z-index: 2; min-width: 220px; background: var(--app-bg); color: var(--app-text);
    border: 1px solid var(--app-line); border-radius: 12px; box-shadow: var(--app-shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .menu-pop .who { display: flex; flex-direction: column; overflow-wrap: anywhere; }
  .menu-pop .who span { color: var(--app-muted); }
  .appbody { padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 360px; }
  .appbody.center { align-items: center; justify-content: center; text-align: center; }
  .appbody.center p { max-width: 34ch; color: var(--app-muted); }
  .hero { width: 64px; height: 64px; border-radius: 18px; background: var(--app-soft); color: var(--app); display: grid; place-items: center; }
  .hero svg { width: 32px; height: 32px; }
  .abtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--app); background: var(--app); color: var(--app-ink);
    border-radius: 999px; padding: 9px 18px; font-weight: 600; cursor: pointer; text-decoration: none; transition: filter 0.12s, transform 0.12s; }
  .abtn.ghost { background: none; color: var(--app); }
  .abtn.small { padding: 5px 12px; font-size: 13px; }
  .abtn:hover:not(:disabled) { filter: brightness(1.08); }
  .abtn:active:not(:disabled) { transform: translateY(1px); }
  .abtn:disabled { opacity: 0.6; cursor: default; }
  .icon-btn { border: 0; background: none; color: var(--app-muted); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; flex: none; }
  .icon-btn:hover:not(:disabled) { background: var(--app-soft); color: var(--app-text); }
  .icon-btn:disabled { cursor: default; }
  .icon-btn svg { width: 17px; height: 17px; }
  .greet { display: flex; align-items: center; gap: 8px; }
  .greet h3 { font-size: 17px; }
  .greet .icon-btn { margin-left: auto; }
  .say { font-size: 14px; color: var(--app-muted); }
  .bubble { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .bubble.ok { background: var(--ok-soft); color: var(--ok); }
  .bubble.wait { background: var(--note-soft); color: var(--note); }
  .bubble.no { background: var(--deny-soft); color: var(--deny); }
  .bubble a { color: inherit; font-weight: 600; }
  .bubble .text { flex: 1; min-width: 0; }
  .bubble .icon-btn { width: 24px; height: 24px; color: inherit; }
  .bubble .spin { margin-top: 4px; }
  .items { list-style: none; margin: 0; padding: 0; border: 1px solid var(--app-line); border-radius: 12px; overflow: hidden; }
  .items li { display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 14px; }
  .items li + li { border-top: 1px solid var(--app-line); }
  .items .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .items .what b { font-weight: 600; overflow-wrap: anywhere; }
  .items .what span { font-size: 12.5px; color: var(--app-muted); }
  .items .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
  .items .total { background: var(--app-soft); font-weight: 600; padding-right: 48px; }
  .items .total .what { font-weight: 600; }
  .items .none { color: var(--app-muted); font-size: 14px; }
  .add { display: grid; grid-template-columns: minmax(0, 1fr) 7em; gap: 8px; border-top: 1px dashed var(--app-line); padding-top: 14px; }
  .add h4 { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--app-text); }
  .add label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--app-muted); }
  .add input, .add select { border: 1px solid var(--app-line); border-radius: 10px; padding: 7px 10px; background: var(--app-bg); color: var(--app-text); width: 100%; }
  .add .wide { grid-column: 1 / -1; }
  .add .abtn { justify-self: start; }
  .fine { font: 12px/1.4 var(--mono); color: var(--app-muted); overflow-wrap: anywhere; max-width: 40ch; }

  /* Behind the scenes: Hush's side of the assistant, set apart in Hush's colour. */
  .feed-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 18px 18px 20px; border-radius: 16px;
    background: color-mix(in srgb, var(--accent) 6%, var(--bg)); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--bg)); }
  .panel-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .panel-head h2 { font-size: 17px; }
  .panel-head .sub { font-size: 13px; color: var(--muted); }
  .howto { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
  #feed > .aside { margin-top: 14px; }
  .howto summary { cursor: pointer; font-weight: 600; color: var(--ink); }
  .howto[open] summary { margin-bottom: 8px; }
  .howto > p + p, .howto > div + p { margin-top: 8px; }
  .flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0; font-size: 12.5px; color: var(--muted); }
  .tok { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--surface); color: var(--ink); }
  .tok.out { border-color: var(--accent); background: var(--accent-soft); }
  .claims { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; margin-top: 6px; }
  .claims .k { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 700; }
  .claims .v { font-family: var(--mono); font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }
  .claims .v span { font-family: var(--sans); color: var(--muted); }
  .feed { list-style: none; margin: 0; padding: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .ev { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 2px 12px; padding: 10px 14px; font-size: 14px; }
  .ev + .ev { border-top: 1px solid var(--line); }
  .ev.new { animation: flash 1.8s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 12%, transparent); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .ev.new { animation: none; } }
  .ev .when { grid-row: span 2; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .ev .what { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
  .ev .what b { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  .ev .then { font-size: 13px; color: var(--muted); }
  .badge { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.wait { background: var(--note-soft); color: var(--note); }
  .badge.no { background: var(--deny-soft); color: var(--deny); }
  .empty { font-size: 13px; color: var(--muted); padding: 12px 14px; background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; }
</style>
</head>
<body>
<header>
  <div class="wrap">

<main>
  <div class="wrap">
    <div class="layout" id="layout">
      <section class="story" id="story"></section>
      <section class="app-col" id="app-col" aria-label="The expenses assistant" hidden>
        <div class="app-label">The agent's app <span>what your users see</span></div>
        <div class="appwin" id="app"></div>
      </section>
      <section class="feed-col" id="behind" aria-label="Behind the scenes" hidden>
        <div class="panel-head"><h2>Behind the scenes</h2><span class="sub">what Hush did with each of the assistant's calls</span></div>
        <div id="feed"></div>
      </section>

</main>

<script>
  const STEPS = [
    { key: "welcome", title: "Welcome" },
    { key: "agent", title: "Register the agent" },
    { key: "access", title: "Grant access to the Expenses service" },
    { key: "try", title: "Try the assistant" },
    { key: "recap", title: "Recap" },
  ];
  const STEP_KEY = "hush-hosted-agent-tutorial-step";
  const DONE_KEY = "hush-hosted-agent-tutorial-done";
  const FEED_POLL_MS = 3000;
  const SETUP_POLL_MS = 5000;
  const CONSENT_POLL_MS = 3000;
  const CONNECT_POLL_MS = 4000;
  const CONNECT_POLLS = 75;
  // Long enough to see that a check ran, even when it answers at once.
  const CHECK_MIN_MS = 600;
  const CATEGORIES = ["Travel", "Lodging", "Meals", "Office", "Other"];
  const TRY_TASKS = ["try-list", "try-submit", "try-delete"];
  // Ticked from what the page finds now, never from an earlier visit: the
  // agent or its assignment may be gone since.
  const LIVE_STEPS = ["agent", "access"];

  let setup = null;
  let me = { signed_in: false };
  let step = initialStep();
  const done = new Set(load(DONE_KEY, []).filter((key) => !LIVE_STEPS.includes(key)));
  // Checks the reader ran: {pending} while asking, {checked} after.
  const checks = {};
  // Behind the scenes: the agent's calls for the user, and the user's
  // approval decisions. Expenses keep their description after they're gone.
  let activity = null;
  const described = new Map();
  let seenEvents = null;
  const HOWTO_KEY = "hush-hosted-agent-tutorial-howto";
  let howtoOpen = load(HOWTO_KEY, false);

  // The assistant, as its user sees it.
  const app = {
    phase: "loading",     // signed_out, loading, connect, ready, unavailable, refused, error
    expenses: [],
    connectUrl: null,
    connecting: false,
    message: "",
    busy: null,           // "list", "submit", or "delete:<id>"
    notice: null,         // {tone, html, waiting}
    menuOpen: false,
    signinError: null,    // why the last sign-in, or the session, ended
    signinRefused: false, // Hush refused the sign-in, rather than the session ending
  };
  // Hush asked the user about the expense being added.
  let consentAsked = false;
  let consentTimer = null;
  let connectTimer = null;

  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (error) { return fallback; }
  }

  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) { /* kept for this page only */ }
  }

  function initialStep() {
    const fromHash = STEPS.findIndex((s) => `#${s.key}` === location.hash);
    if (fromHash >= 0) return fromHash;
    const saved = Number(load(STEP_KEY, 0));
    return saved >= 0 && saved < STEPS.length ? saved : 0;
  }

  function markDone(key) {
    if (done.has(key)) return;
    done.add(key);
    save(DONE_KEY, [...done]);
  }

  // Trying the assistant starts over with each sign-in.
  function forgetTries() {
    for (const key of [...TRY_TASKS, "try"]) done.delete(key);
    save(DONE_KEY, [...done]);
  }

  const isDone = (key) => key === "agent" ? registered() : key === "access" ? assigned() : done.has(key);

  // Replaces an element's content only when it changed: a poll that finds
  // nothing new leaves the reader's text selection and focus alone.
  const rendered = new WeakMap();
  function setHtml(element, html) {
    if (rendered.get(element) === html) return false;
    element.innerHTML = html;
    rendered.set(element, html);
    return true;
  }

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  // A value to type into the Hush UI, with its own copy button.
  const val = (text) => text
    ? `<span class="val"><code>${esc(text)}</code><button class="copy" type="button" data-copy="${esc(text)}">Copy</button></span>`
    : `<span class="val"><code>unknown</code></span>`;
  const cmd = (text) => `<div class="cmd"><code>${esc(text)}</code><button class="copy" type="button" data-copy="${esc(text)}">Copy</button></div>`;
  const fields = (rows, cls = "") => `<table class="fields ${cls}">${rows.map(([k, ...v]) => `<tr><th>${k}</th>${v.map((x) => `<td>${x}</td>`).join("")}</tr>`).join("")}</table>`;
  const spinner = `<span class="spin" aria-hidden="true"></span>`;
  const money = (amount) => Number(amount).toFixed(2);

  async function api(path, body) {
    const options = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    try {
      const response = await fetch(path, options);
      const reply = await response.json().catch(() => ({}));
      return response.ok ? reply : { kind: reply.not_assigned ? "not_assigned" : "error", message: reply.message || `HTTP ${response.status}`,
        ...reply, status: response.status };
    } catch (error) {
      return { kind: "error", message: "The agent's page is unreachable: is kubectl port-forward still running?" };
    }
  }

  const serviceAccount = (subject) => /^system:serviceaccount:([^:]+):(.+)$/.exec(subject || "") || [];
  const stepOf = (key) => STEPS.findIndex((s) => s.key === key);
  const goTo = (key, label) => `<button class="btn" type="button" data-step="${stepOf(key)}">${label}</button>`;
  const agentName = () => setup?.agent?.hush?.name || setup?.agent?.hush?.id;
  const appName = () => setup?.expenses?.in_hush?.display_name || "Expenses (tutorial)";
  const registered = () => Boolean(setup?.agent?.hush?.id);
  const assigned = () => setup?.expenses?.assigned?.assigned === true;
  const inHush = () => setup?.expenses?.in_hush || { state: "unknown" };

  // A button that asks the agent how things stand: it shows that it's asking.
  function checkButton(id, label) {
    const pending = checks[id]?.pending;
    return `<div class="row"><button class="btn" type="button" data-check="${id}"${pending ? " disabled" : ""}>
      ${pending ? spinner : ""}${label}</button>${pending ? `<span class="note">Checking…</span>` : ""}</div>`;
  }

  async function runCheck(id) {
    checks[id] = { pending: true };
    render();
    await Promise.all([loadSetup(), sleep(CHECK_MIN_MS)]);
    checks[id] = { checked: true };
    render();
  }

  function setupWarnings() {
    if (!setup) return "";
    const notes = [];
    const { agent, gateway } = setup;
    if (!agent.issuer) notes.push("The agent has no Kubernetes token: check its pod.");
    if (gateway.error) notes.push(`The agent can't read the gateway's sign-in details: ${esc(gateway.error)}`);
    else if (agent.issuer && !agent.audience.includes(gateway.issuer)) {
      notes.push(`The agent's platform token is issued for <code>${esc(agent.audience.join(", "))}</code>, but the gateway's
        issuer is <code>${esc(gateway.issuer)}</code>. Set <code>gateway.issuer</code> to it and upgrade the chart.`);
    }
    return notes.map((n) => `<p class="warn">${n}</p>`).join("");
  }

  function inHushStatus() {
    const h = inHush();
    if (h.state === "ready") return `<p class="status ok">✓ <span>Hush has <b>${esc(appName())}</b>: in the catalog, and on your gateway for all users.</span></p>`;
    if (h.state === "failed") return `<p class="warn">The tutorial couldn't put the Expenses service in Hush yet, and keeps trying: ${esc(h.error)}</p>`;
    if (h.state === "working") return `<p class="status wait">${spinner}<span>The tutorial is putting the Expenses service in Hush…</span></p>`;
    return `<p class="warn">Can't tell whether the Expenses service is in Hush: is the tutorial's setup pod running?</p>`;
  }

  // ---- Steps -------------------------------------------------------------------

  function storyWelcome() {
    const a = setup?.agent || {};
    const [, namespace, account] = serviceAccount(a.subject);
    const url = setup?.expenses?.url;
    return `
      <h1>An agent that works for your users</h1>
      <p>An expenses assistant, an agent running in your Kubernetes cluster, keeps your expense reports up to date
        for you. It reaches the Expenses service, one of your company's apps, only through your Hush Identity Gateway, and Hush
        decides what it may do, and for whom.</p>
      <p class="note">You need an admin's access to the Hush UI.</p>
      <h2>Already in place</h2>
      <p>Installing the tutorial set up:</p>
      <ul class="points">
        <li><span><b>The assistant</b>: the agent, running${namespace ? ` in namespace <code>${esc(namespace)}</code> as
          service account <code>${esc(account)}</code>` : ""}. It holds no secret.</span></li>
        <li><span><b>The Expenses service</b>: a small MCP app standing in for one of your company's apps${url ? `, public at
          <code>${esc(url)}</code>` : ""}. It has its own accounts.</span></li>
        <li><span><b>${esc(appName())}</b> in Hush: the Expenses service, in Hush's catalog and on your Hush Identity Gateway for all users.</span></li>
      </ul>
      ${inHush().state === "ready" ? "" : inHushStatus()}
      <h2>What you'll do</h2>
      <ol class="tasks">
        <li><div><b>Register the agent</b> in Hush, so Hush knows it by its Kubernetes identity.</div></li>
        <li><div><b>Grant it access to the Expenses service.</b></div></li>
        <li><div><b>Try the assistant</b> as one of its users: sign in, connect your account on the Expenses service, then list, add
          and delete expenses, and see what Hush lets through.</div></li>
      </ol>
      <div class="nav-row"><button class="btn primary" type="button" data-step="${stepOf("agent")}">Start: Register the agent</button></div>`;
  }

  function storyAgent() {
    const a = setup?.agent || {};
    const [, namespace, account] = serviceAccount(a.subject);
    const hush = a.hush || {};
    let result = "";
    if (registered()) {
      result = `<div class="result ok" role="status"><span>✓ Hush knows the agent as <b>${esc(agentName())}</b>.</span></div>`;
    } else if (checks.agent?.checked) {
      result = hush.unknown
        ? `<div class="result no" role="status"><span>Hush doesn't know this agent yet. Check that you registered it,
            and that its Kubernetes authentication matches the values above.</span>
            <span class="detail">Hush's reason: ${esc(hush.reason || hush.error)}</span></div>`
        : `<div class="result no" role="status"><span>Couldn't ask Hush about the agent.</span>
            <span class="detail">${esc(hush.reason || hush.error || "No answer.")}</span></div>`;
    }
    return `
      <h1>Register the agent</h1>
      <p>The assistant runs in your cluster as a Kubernetes service account, and holds no secret: Kubernetes gives it a
        short-lived platform token, issued for your gateway. Register it in Hush, so Hush trusts that token.</p>
      <ol class="tasks">
        <li><div>In the Hush UI, go to <b>Agentic AI › Registry</b> and click <b>Register Agent</b>. Name it, and turn on
          <b>Act for users</b>.
          ${fields([["Name", val("expenses-assistant")]])}</div></li>
        <li><div>In its <b>Authentication</b> tab, click <b>Add Authentication</b>, choose type <b>Kubernetes</b>, and set:
          ${fields([["Cluster issuer", val(a.issuer)], ["Namespace", val(namespace)], ["Service account", val(account)]])}</div></li>
      </ol>
      ${setupWarnings()}
      ${registered() ? "" : checkButton("agent", "Check registration")}
      ${result}
      <div class="nav-row">
        ${goTo("welcome", "Back")}
        <button class="btn${registered() ? " primary" : ""}" type="button" data-step="${stepOf("access")}">Next: Grant access to the Expenses service</button>
      </div>`;
  }

  function storyAccess() {
    const e = setup?.expenses || {};
    const a = e.assigned || {};
    let result = "";
    if (assigned()) {
      result = `<div class="result ok" role="status"><span>✓ ${esc(appName())} is assigned to ${agentName() ? `<b>${esc(agentName())}</b>` : "the agent"}.</span></div>`;
    } else if (checks.access?.checked) {
      if (!registered()) {
        result = `<div class="result no" role="status"><span>Register the agent first.</span></div>`;
      } else if (a.assigned === false) {
        result = `<div class="result no" role="status"><span>Not yet: no assignment of ${esc(appName())} names
          <b>${esc(agentName())}</b>.</span></div>`;
      } else {
        result = `<div class="result no" role="status"><span>Couldn't read ${esc(appName())}'s assignments.</span>
          <span class="detail">${esc(a.error || "The Expenses service isn't in Hush yet.")}</span></div>`;
      }
    }
    return `
      <h1>Grant the agent access to the Expenses service</h1>
      <p>The Expenses service is a small MCP app, standing in for one of your company's apps. Each user signs in to it with their
        email, and sees only their own expenses.</p>
      ${inHushStatus()}
      <p>By default, Hush gives each tool a policy by what it does. You can leave them as they are:</p>
      <table class="fields policies"><thead><tr><th>Tool</th><th>What it does</th><th>Default policy</th></tr></thead>
        <tbody>${[
          ["list_expenses", "reads", "allowed"],
          ["submit_expense", "writes", "asks the user first"],
          ["delete_expense", "deletes", "blocked"],
        ].map(([tool, does, policy]) => `<tr><th><code>${tool}</code></th><td>${does}</td><td>${policy}</td></tr>`).join("")}</tbody></table>
      <p>The Expenses service is already on for all your users. But an agent acting for a user reaches an app only when the app is
        assigned to the agent too: that's yours to do.</p>
      <ol class="tasks">
        <li><div>In the Hush UI, go to <b>Applications</b> and open <b>${esc(appName())}</b>.</div></li>
        <li><div>In its <b>Assignments</b> tab, click <b>Add</b> and pick ${agentName() ? `<b>${esc(agentName())}</b>` : "your agent"}.</div></li>
      </ol>
      ${assigned() ? "" : checkButton("access", "Check assignment")}
      ${result}
      <div class="nav-row">
        ${goTo("agent", "Back")}
        <button class="btn${assigned() ? " primary" : ""}" type="button" data-step="${stepOf("try")}">Next: Try the assistant</button>
      </div>`;
  }

  // Where the reader is in trying the assistant, from the assistant's state.
  function tryPart() {
    if (!me.signed_in) return "signin";
    if (app.phase === "ready") return "use";
    return "connect";
  }

  // What stops the assistant, past signing in: not a step of its own.
  function tryProblem() {
    if (!me.signed_in) return "";
    if (app.phase === "unavailable") {
      return `<div class="result no" role="status"><span>The gateway doesn't offer the Expenses service to the agent, for you.</span>
        <span>Check that ${esc(appName())} is assigned to the agent.</span></div>
        <div class="row">${goTo("access", "Go to Grant access to the Expenses service")}</div>`;
    }
    if (app.phase === "refused") {
      return `<div class="result no" role="status"><span>Hush refused the token exchange: the agent may not act for you.</span>
        <span>Check the agent in the Hush registry: is <b>Act for users</b> on, and are you one of its assigned users?</span></div>`;
    }
    if (app.phase === "error") {
      return `<div class="result no" role="status"><span>The agent couldn't reach the Expenses service.</span><span class="detail">${esc(app.message)}</span></div>`;
    }
    return "";
  }

  function storyTry() {
    const part = tryPart();
    const problem = tryProblem();
    const steps = [["signin", "Sign in"], ["connect", "Connect the Expenses service"], ["use", "Work on your expenses"]];
    const at = steps.findIndex(([key]) => key === part);
    const guide = { signin: trySignIn, connect: tryConnect, use: tryUse }[part]();
    return `
      <div class="try-head">${eyebrow()}
        <h1>Try the assistant</h1>
        <p>The assistant is the agent's own app, as your users see it. Use it as one of them: <b>Behind the scenes</b>
          shows what each of its calls set off.</p>
        <ol class="progress">${steps.map(([key, title], i) => {
          const s = i < at ? "done" : i === at && !problem ? "current" : "todo";
          return `<li class="${s}"><span class="mark">${s === "done" ? "✓" : i + 1}</span>${title}</li>`;
        }).join("")}</ol>
      </div>
      <div class="try-guide">
        ${problem || `<div class="guide">${guide}</div>`}
        <div class="nav-row">
          ${goTo("access", "Back")}
          <button class="btn${done.has("try") ? " primary" : ""}" type="button" data-step="${stepOf("recap")}">Next: Recap</button>
        </div>
      </div>`;
  }

  function trySignIn() {
    return `<p>Click <b>Sign in</b> in the assistant. It sends you to Hush, where you sign in with your usual
      company account. Hush then gives the agent a Hush access token for you that only this agent can use.
      <b>Behind the scenes</b> shows how the agent uses it on each call.</p>
      ${app.signinError ? `<div class="result no" role="status"><span>${app.signinRefused
        ? "Hush refused the last sign-in." : "The agent no longer has your sign-in."}</span>
        <span class="detail">${esc(app.signinError)}</span></div>` : ""}`;
  }

  function tryConnect() {
    const e = setup?.expenses || {};
    if (app.phase !== "connect") return `<p class="status wait">${spinner}<span>The assistant is reaching the Expenses service through the gateway…</span></p>`;
    return `
      <p>The Expenses service has its own accounts. The first time the agent reaches it for you, the gateway asks
        you to connect your account there, once. It keeps that connection and uses it on your calls: the agent never
        sees it.</p>
      <p>Click <b>Connect the Expenses service</b> in the assistant. Its sign-in asks for your email${e.access_code ? " and this access code" : ""}:</p>
      ${fields([["Email", val(me.email)], ...(e.access_code ? [["Access code", val(e.access_code)]] : [])])}
      ${e.access_code ? `<p class="aside">The Expenses service is public, through a Cloudflare quick tunnel. The access code keeps
        others from signing in to it.</p>` : ""}`;
  }

  function tryUse() {
    const tasks = [
      ["try-list", "See your expenses", "a read: allowed by default"],
      ["try-submit", "Add an expense", "a write: asks you first, by default"],
      ["try-delete", "Delete an expense", "a delete: blocked by default"],
    ];
    const all = tasks.every(([key]) => done.has(key));
    return `
      <p>The assistant calls the Expenses service through the Hush Identity Gateway, which checks each call against the
        tools' policies. Try each:</p>
      <ul class="checklist inline">${tasks.map(([key, title, why]) =>
        `<li class="${done.has(key) ? "yes" : ""}"><span class="tick">${done.has(key) ? "✓" : ""}</span>
          <span>${title} <span class="why">· ${why}</span></span></li>`).join("")}</ul>
      ${consentAsked ? `<div class="result wait"><span>The gateway is holding the call: <code>submit_expense</code> writes, so
        it asks you first. Click <b>Review the request</b> in the assistant and approve it. The assistant then adds it
        again, and this time the token exchange carries your approval.</span></div>` : ""}
      ${all ? `<div class="result ok"><span>That's the whole flow. Next, a recap.</span></div>` : ""}`;
  }

  function storyRecap() {
    const namespace = serviceAccount(setup?.agent?.subject)[1] || "<namespace>";
    return `
      <h1>Recap</h1>
      <ul class="points">
        <li>The agent holds no secret: its platform token is all it has.</li>
        <li>Each call begins with a token exchange, which gives a Hush access token naming both you and the agent.</li>
        <li>The agent reaches an app only when the app is assigned to it, and open to the user it acts for.</li>
        <li>Every call is checked against the tools' policies. By default, a read goes through, a write waits for you,
          and a delete is blocked.</li>
        <li>The Expenses service sees you, in your own account. The gateway keeps your connection to it: the agent never sees it.</li>
      </ul>
      <h2>Clean up</h2>
      <p>Uninstall the tutorial, before your API key expires: it takes the Expenses service out of Hush too.</p>
      ${cmd(`helm uninstall ${setup?.release || "<release>"} -n ${namespace}`)}
      <p>Then, in the Hush UI, delete the agent, and the API key unless it has expired.</p>
      <div class="nav-row">${goTo("try", "Back")}</div>`;
  }

  const eyebrow = () => `<span class="eyebrow">Step ${step + 1} of ${STEPS.length}</span>`;
  const STORIES = { welcome: storyWelcome, agent: storyAgent, access: storyAccess, try: storyTry, recap: storyRecap };

  // ---- The assistant -------------------------------------------------------------

  const ICONS = {
    logo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>`,
    trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`,
    refresh: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>`,
    close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
    lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`,
    plug: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg>`,
  };

  const firstName = () => (me.name || "").split(/\s+/)[0] || (me.email || "").split("@")[0];
  const initials = () => {
    const words = (me.name || me.email || "?").split(/[\s@.]+/).filter(Boolean);
    return (words[0]?.[0] || "?").toUpperCase() + (words[1]?.[0] || "").toUpperCase();
  };

  function renderApp() {
    const bar = `<div class="appbar"><span class="applogo">${ICONS.logo}</span>
      <span class="appname"><b>Expenses Assistant</b><small>Your AI expenses helper</small></span>
      ${me.signed_in ? `<details class="menu" id="app-menu"${app.menuOpen ? " open" : ""}>
        <summary class="avatar" aria-label="Account">${esc(initials())}</summary>
        <div class="menu-pop"><span class="who"><b>${esc(me.name || me.email)}</b>${me.name ? `<span>${esc(me.email)}</span>` : ""}</span>
          <button class="abtn ghost small" type="button" data-app="signout">Sign out</button></div></details>` : ""}</div>`;
    const kept = ["x-description", "x-amount", "x-category"].map((id) => [id, document.getElementById(id)?.value]);
    if (!setHtml(document.getElementById("app"), bar + appBody())) return;
    for (const [id, value] of kept) {
      const input = document.getElementById(id);
      if (input && value !== undefined) input.value = value;
    }
  }

  function appBody() {
    const center = (icon, title, text, actions = "") => `<div class="appbody center"><span class="hero">${icon}</span>
      <h3>${title}</h3><p>${text}</p>${actions}</div>`;
    const retry = `<button class="abtn ghost" type="button" data-app="list">Try again</button>`;
    switch (app.phase) {
      case "signed_out":
        return center(ICONS.logo, "Your expense reports, handled",
          "I keep your expense reports up to date: I list them, add new ones and tidy up old ones, for you.",
          `${app.signinError ? `<p class="fine">${esc(app.signinError)}</p>` : ""}
          <a class="abtn" href="/signin">Sign in with your company account</a>`);
      case "loading":
        return `<div class="appbody center"><span class="spin" aria-hidden="true"></span><p>Opening your expenses…</p></div>`;
      case "connect":
        return center(ICONS.plug, `Hi ${esc(firstName())}!`,
          "To work on your expense reports, I need your account on the Expenses service. You connect it once.",
          app.connecting
            ? `<p class="status wait">${spinner}<span>Waiting for you to finish in the Expenses service…</span></p>
              <button class="abtn ghost small" type="button" data-app="list">Done? Check now</button>`
            : `<button class="abtn" type="button" data-app="connect"${app.connectUrl ? "" : " disabled"}>Connect the Expenses service</button>`);
      case "unavailable":
        return center(ICONS.lock, "I can't reach the Expenses service for you",
          "Your company hasn't given me access to the Expenses service yet.", retry);
      case "refused":
        return center(ICONS.lock, "I can't work for you",
          "Your company hasn't allowed me to act for you.", retry);
      case "error":
        return center(ICONS.lock, "Something went wrong", "I couldn't reach the Expenses service.", `<span class="fine">${esc(app.message)}</span>${retry}`);
      default:
        return appReady();
    }
  }

  function appReady() {
    const rows = Array.isArray(app.expenses) ? app.expenses : [];
    const total = rows.reduce((sum, x) => sum + Number(x.amount || 0), 0);
    const n = app.notice;
    const busy = app.busy !== null;
    return `<div class="appbody">
      <div class="greet"><h3>Hi ${esc(firstName())}, here are your expenses</h3>
        <button class="icon-btn" type="button" data-app="list" aria-label="Refresh"${busy ? " disabled" : ""}>${app.busy === "list" ? spinner : ICONS.refresh}</button></div>
      ${n ? `<div class="bubble ${n.tone}" role="status">${n.waiting ? spinner : ""}<span class="text">${n.html}</span>
        ${n.waiting ? "" : `<button class="icon-btn" type="button" data-app="dismiss" aria-label="Dismiss">${ICONS.close}</button>`}</div>` : ""}
      <ul class="items">
        ${rows.length ? rows.map((x) => `<li><span class="what"><b>${esc(x.description)}</b><span>${esc(x.category)}${x.date ? ` · ${esc(x.date)}` : ""}</span></span>
          <span class="amt">${esc(money(x.amount))}</span>
          <button class="icon-btn" type="button" data-app="delete" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.description)}"${busy ? " disabled" : ""}>
            ${app.busy === `delete:${x.id}` ? spinner : ICONS.trash}</button></li>`).join("")
          + `<li class="total"><span class="what">Total</span><span class="amt">${esc(money(total))}</span></li>`
          : `<li class="none">No expenses yet.</li>`}
      </ul>
      <form class="add" id="add-form">
        <h4>Add an expense</h4>
        <label class="wide">Description<input id="x-description" value="Hotel" required></label>
        <label>Category<select id="x-category">${CATEGORIES.map((c) => `<option${c === "Lodging" ? " selected" : ""}>${c}</option>`).join("")}</select></label>
        <label>Amount<input id="x-amount" value="210" inputmode="decimal" required></label>
        <button class="abtn" type="submit"${busy ? " disabled" : ""}>${app.busy === "submit" ? spinner : ""}Add</button>
      </form>
    </div>`;
  }

  // What a call through the gateway came to, for everything but its own success.
  function setPhaseFrom(r) {
    switch (r.kind) {
      case "connect": app.phase = "connect"; app.connectUrl = r.url; return;
      case "not_available": app.phase = "unavailable"; return;
      case "not_assigned": app.phase = "refused"; return;
      case "signed_out": signedOut(r.message); return;
      default:
        if (r.error === "login_required") { signedOut(r.message); return; }
        app.phase = "error"; app.message = r.message || "Something went wrong.";
    }
  }

  async function appList({ quiet = false } = {}) {
    if (!quiet) { app.busy = "list"; if (app.phase !== "ready" && app.phase !== "connect") app.phase = "loading"; render(); }
    const r = await api("/api/expenses/list", {});
    if (!me.signed_in) return;
    app.busy = null;
    if (r.kind === "done") {
      app.phase = "ready";
      app.expenses = r.data;
      for (const x of Array.isArray(r.data) ? r.data : []) described.set(String(x.id), x.description);
      stopConnecting();
      markDone("try-list");
    } else if (!(quiet && r.kind === "connect")) {
      setPhaseFrom(r);
    }
    render();
    refreshFeed();
  }

  function startConnecting() {
    if (app.connectUrl) window.open(app.connectUrl, "_blank", "noopener");
    app.connecting = true;
    render();
    let polls = 0;
    clearInterval(connectTimer);
    connectTimer = setInterval(() => {
      if (++polls > CONNECT_POLLS) { stopConnecting(); render(); return; }
      if (!document.hidden) appList({ quiet: true });
    }, CONNECT_POLL_MS);
  }

  function stopConnecting() {
    clearInterval(connectTimer);
    app.connecting = false;
  }

  // The agent no longer has the user's sign-in: back to signing in.
  function signedOut(message = null) {
    me = { signed_in: false };
    activity = null;
    clearTimeout(consentTimer);
    stopConnecting();
    Object.assign(app, { phase: "signed_out", expenses: [], notice: null, busy: null, menuOpen: false,
      signinError: message, signinRefused: false });
    consentAsked = false;
    forgetTries();
    renderFeed();
  }

  async function appSubmit(draft) {
    app.busy = "submit";
    app.notice = null;
    render();
    const r = await api("/api/expenses/submit", draft);
    if (!me.signed_in) return;
    app.busy = null;
    const what = `“${esc(draft.description)}” (${esc(money(draft.amount))})`;
    if (r.kind === "done") {
      app.notice = { tone: "ok", html: `Added ${what}.` };
      consentAsked = false;
      markDone("try-submit");
      return appList({ quiet: true });
    }
    if (r.kind === "consent") {
      app.notice = { tone: "wait", waiting: Boolean(r.request_id), html: `I need your OK before I add ${what}.
        ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Review the request</a>` : "Approve it where Hush asks you."}
        ${r.request_id ? "" : " Then add it again."}` };
      consentAsked = true;
      if (r.request_id) waitForConsent(r.request_id, draft);
    } else if (r.kind === "blocked") {
      app.notice = { tone: "no", html: "I'm not allowed to add expenses: your company's policy blocks it." };
    } else if (r.kind === "error") {
      app.notice = { tone: "no", html: `I couldn't add it: ${esc(r.message)}` };
    } else {
      setPhaseFrom(r);
    }
    render();
    refreshFeed();
  }

  // Asks Hush, through the agent, until the request is decided; then adds it
  // again, as the next exchange carries the approval.
  function waitForConsent(requestId, draft) {
    clearTimeout(consentTimer);
    consentTimer = setTimeout(async () => {
      const r = await api(`/api/consent/${encodeURIComponent(requestId)}`);
      if (!me.signed_in) return;
      if (r.status === "pending") return waitForConsent(requestId, draft);
      if (r.status === "granted") return appSubmit(draft);
      if (r.error === "login_required") { signedOut(r.message); render(); return; }
      app.notice = r.status === "denied"
        ? { tone: "no", html: "You declined, so I didn't add it." }
        : r.status === "expired"
          ? { tone: "no", html: "The approval request expired. Add it again to ask again." }
          : { tone: "no", html: `I couldn't tell whether you approved: ${esc(r.message)}` };
      consentAsked = false;
      render();
    }, CONSENT_POLL_MS);
  }

  async function appDelete(id) {
    const expense = app.expenses.find((x) => String(x.id) === String(id));
    const what = expense ? `“${esc(expense.description)}”` : "it";
    app.busy = `delete:${id}`;
    app.notice = null;
    render();
    const r = await api("/api/expenses/delete", { expense_id: id });
    if (!me.signed_in) return;
    app.busy = null;
    if (r.kind === "blocked") {
      app.notice = { tone: "no", html: `I'm not allowed to delete ${what}: your company's policy blocks deleting expenses.` };
      markDone("try-delete");
    } else if (r.kind === "done") {
      app.notice = { tone: "ok", html: `Deleted ${what}.` };
      return appList({ quiet: true });
    } else if (r.kind === "consent") {
      app.notice = { tone: "wait", html: `I need your OK before I delete ${what}.
        ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Review the request</a>, then` : "Approve it, then"} delete it again.` };
    } else if (r.kind === "error") {
      app.notice = { tone: "no", html: `I couldn't delete ${what}: ${esc(r.message)}` };
    } else {
      setPhaseFrom(r);
    }
    render();
    refreshFeed();
  }

  // ---- Behind the scenes --------------------------------------------------------

  async function refreshFeed() {
    if (!me.signed_in) { activity = null; renderFeed(); return; }
    const a = await api("/api/activity");
    if (!me.signed_in) return;
    if (Array.isArray(a.events)) activity = a.events;
    renderFeed();
  }

  const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  // What the assistant did, in the user's words.
  function action(ev) {
    const a = ev.arguments || {};
    if (ev.tool === "list_expenses") return "List your expenses";
    if (ev.tool === "submit_expense") return `Add “${esc(a.description)}”, ${esc(money(a.amount))}`;
    if (ev.tool === "delete_expense") {
      const description = described.get(String(a.expense_id));
      return description ? `Delete “${esc(description)}”` : `Delete expense ${esc(a.expense_id)}`;
    }
    return esc(ev.tool);
  }

  // What Hush decided, in a few words, and a note only when something is off.
  function decision(ev) {
    if (ev.kind === "decision") {
      if (ev.decision === "granted") return ["ok", "You approved", "The assistant adds it again: this time the token exchange carries your approval."];
      if (ev.decision === "denied") return ["no", "You declined", "So the assistant doesn't add it."];
      return ["wait", "The request expired", "Add it again to ask again."];
    }
    switch (ev.outcome) {
      case "done":
        if (ev.approval === "just") return ["ok", "Allowed, after your approval"];
        if (ev.approval === "earlier") return ["ok", "Allowed: you approved earlier"];
        if (ev.tool === "delete_expense") return ["wait", "Allowed", "Is <code>delete_expense</code> still blocked in Hush?"];
        if (ev.tool === "submit_expense") return ["wait", "Allowed without asking", "Is <code>submit_expense</code> set to ask the user in Hush?"];
        return ["ok", "Allowed"];
      case "consent": return ["wait", "Waiting for your approval"];
      case "blocked": return ["ok", "Blocked by policy, as expected"];
      case "connect": return ["wait", "Connect the Expenses service first"];
      case "not_available": return ["no", "Not offered to the agent", "Is Expenses (tutorial) assigned to the agent?"];
      case "not_assigned": return ["no", "Refused", `Hush refused the token exchange: ${esc(ev.exchange?.error || ev.message)}`];
      case "signed_out": return ["no", "Signed out", esc(ev.message)];
      case "refused": return ["no", "Refused", `Hush answered: ${esc(ev.message)}`];
      default: return ["no", "Failed", esc(ev.exchange?.error ? `The token exchange failed: ${ev.exchange.error}` : ev.message)];
    }
  }

  // Whether the call reached the Expenses service, and on which of its
  // accounts: the one the user connected, which needn't be their Hush email.
  function reached(ev) {
    if (ev.kind === "decision") return "";
    if (ev.outcome === "consent") return "This hasn't reached the Expenses service.";
    if (ev.outcome !== "done") return "This never reached the Expenses service.";
    const account = ev.seen?.account;
    if (!account) return "This reached the Expenses service.";
    const other = me.email && account.toLowerCase() !== me.email.toLowerCase();
    return `This reached the Expenses service as <b>${esc(account)}</b>${other
      ? ": the account you connected, not your Hush email" : ""}.`;
  }

  // Told once: how every call reaches the Expenses service.
  function howto() {
    const c = (activity || []).find((ev) => ev.exchange?.claims)?.exchange.claims;
    const act = c && (typeof c.act === "object" ? c.act.sub : c.act);
    return `<details class="howto" id="howto"${howtoOpen ? " open" : ""}><summary>How each call reaches the Expenses service</summary>
      <p>Before every call, the agent trades two tokens at Hush for one that names you both (an RFC 8693 token exchange):</p>
      <div class="flow"><span class="tok">the agent's platform token</span>+<span class="tok">your Hush access token</span>
        →<b>Hush</b>→<span class="tok out">a Hush access token for you and the agent</span></div>
      ${c ? `<div class="claims"><span class="k">sub</span><span class="v">${esc(c.sub)} <span>you, as Hush knows you</span></span>
        ${c.email ? `<span class="k">email</span><span class="v">${esc(c.email)} <span>your email</span></span>` : ""}
        <span class="k">act</span><span class="v">${esc(agentName() || act)} <span>the agent, acting for you</span></span></div>` : ""}
      <p>The gateway checks that token and the tool's policy, then calls the Expenses service with your own connection to it.</p>
    </details>`;
  }

  function renderFeed() {
    const box = document.getElementById("feed");
    if (!me.signed_in) {
      setHtml(box, `${howto()}<p class="empty">Sign in to the assistant: each call it makes for you shows up here.</p>`);
      return;
    }
    const fresh = (ev) => seenEvents && !seenEvents.has(`${ev.id}:${ev.repeats}`);
    const rows = (activity || []).map((ev) => {
      const [tone, said, note] = decision(ev);
      const then = [note && `${note}${/[.?!]$/.test(note) ? "" : "."}`, reached(ev)].filter(Boolean).join(" ");
      return `<li class="ev${fresh(ev) ? " new" : ""}"><span class="when">${esc(clock(ev.time))}</span>
        <span class="what"><b>${action(ev)}</b><span class="badge ${tone}">${said}${ev.repeats > 1 ? ` ×${ev.repeats}` : ""}</span></span>
        <span class="then">${then}</span></li>`;
    }).join("");
    setHtml(box, `${howto()}${rows ? `<ol class="feed">${rows}</ol>` : `<p class="empty">Nothing yet: the assistant's first call for you shows up here.</p>`}
      <p class="aside">Hush records every call too: in the Hush UI, open <b>Applications</b>, then
        <b>${esc(appName())}</b>, and its <b>Activity</b> tab.</p>`);
    seenEvents = new Set((activity || []).map((ev) => `${ev.id}:${ev.repeats}`));
  }

  // ---- Page ----------------------------------------------------------------------

  function render() {
    const key = STEPS[step].key;
    if (key === "welcome" || key === "recap") markDone(key);
    if (TRY_TASKS.every((k) => done.has(k))) markDone("try");
    setHtml(document.getElementById("stepbar"), STEPS.map((s, i) =>
      `<li><button type="button" data-step="${i}" class="${isDone(s.key) ? "done" : ""}"${i === step ? ` aria-current="step"` : ""}>
        <span class="n">${isDone(s.key) && i !== step ? "✓" : i + 1}</span>${esc(s.title)}</button></li>`).join(""));

    const trying = key === "try";
    document.getElementById("layout").classList.toggle("with-app", trying);
    document.getElementById("app-col").hidden = !trying;
    document.getElementById("behind").hidden = !trying;
    setHtml(document.getElementById("story"), trying ? storyTry() : `${eyebrow()}${STORIES[key]()}`);
    if (trying) {
      renderApp();
      renderFeed();
    }
  }

  function show(index) {
    step = index;
    save(STEP_KEY, step);
    history.replaceState(null, "", `#${STEPS[step].key}`);
    render();
    window.scrollTo({ top: 0 });
    if (STEPS[step].key === "try") {
      if (me.signed_in && app.phase === "loading" && app.busy !== "list") appList();
      refreshFeed();
    }
  }

  document.addEventListener("click", async (event) => {
    const target = event.target.closest("button");
    if (!target) return;
    if (target.dataset.copy !== undefined) {
      try { await navigator.clipboard.writeText(target.dataset.copy); target.textContent = "Copied"; }
      catch (error) { target.textContent = "Copy failed"; }
      setTimeout(() => { target.textContent = "Copy"; }, 1500);
    } else if (target.dataset.step !== undefined) {
      show(Number(target.dataset.step));
    } else if (target.dataset.check) {
      runCheck(target.dataset.check);
    } else if (target.dataset.app === "list") {
      appList();
    } else if (target.dataset.app === "connect") {
      startConnecting();
    } else if (target.dataset.app === "delete") {
      appDelete(target.dataset.id);
    } else if (target.dataset.app === "dismiss") {
      app.notice = null;
      render();
    } else if (target.dataset.app === "signout") {
      await api("/api/signout", {});
      signedOut();
      render();
    }
  });

  document.addEventListener("submit", (event) => {
    if (event.target.id !== "add-form") return;
    event.preventDefault();
    appSubmit({
      description: document.getElementById("x-description").value,
      amount: document.getElementById("x-amount").value,
      category: document.getElementById("x-category").value,
    });
  });

  document.addEventListener("toggle", (event) => {
    if (event.target.id === "app-menu") app.menuOpen = event.target.open;
    if (event.target.id === "howto") { howtoOpen = event.target.open; save(HOWTO_KEY, howtoOpen); }
  }, true);

  // Back from connecting the Expenses service in the other tab: look at once.
  window.addEventListener("focus", () => { if (app.connecting) appList({ quiet: true }); });

  async function loadSetup() {
    setup = await api("/api/setup");
    if (!setup.agent) setup = null;
  }

  async function start() {
    render();
    // Back from a sign-in Hush refused.
    const params = new URLSearchParams(location.search);
    if (params.has("signin_error")) {
      app.signinError = params.get("signin_error");
      app.signinRefused = true;
      history.replaceState(null, "", location.pathname + location.hash);
    }
    [, me] = await Promise.all([loadSetup(), api("/api/me")]);
    if (me.signed_in === undefined) me = { signed_in: false };
    if (!me.signed_in) {
      app.phase = "signed_out";
      forgetTries();
    }
    render();
    if (me.signed_in && STEPS[step].key === "try") appList();
    refreshFeed();
    setInterval(() => { if (!document.hidden && STEPS[step].key === "try") refreshFeed(); }, FEED_POLL_MS);
    // Hush gets the Expenses service in the background: show it once it does.
    setInterval(async () => {
      if (document.hidden || !["welcome", "access"].includes(STEPS[step].key) || inHush().state === "ready") return;
      await loadSetup();
      render();
    }, SETUP_POLL_MS);
  }

  start();
</script>
</body>
</html>
