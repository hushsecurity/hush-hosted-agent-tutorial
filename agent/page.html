<script>
  const STEPS = [
    { key: "welcome", title: "Welcome" },
    { key: "agent", title: "Register the agent" },
    { key: "access", title: "Grant access" },
    { key: "try", title: "Try the assistant" },
    { key: "killswitch", title: "Kill switch", optional: true },
    { key: "rules", title: "Who it works for", optional: true },
    { key: "recap", title: "Recap" },
  ];
  const STEP_KEY = "hush-hosted-agent-tutorial-step";
  const DONE_KEY = "hush-hosted-agent-tutorial-done";
  const FEED_POLL_MS = 3000;
  // The log shows this many of its latest events; the rest open on a click.
  const FEED_RECENT = 4;
  const SETUP_POLL_MS = 5000;
  const CONSENT_POLL_MS = 3000;
  const CONNECT_POLL_MS = 4000;
  const CONNECT_POLLS = 75;
  // Long enough to see that a check ran, even when it answers at once.
  const CHECK_MIN_MS = 600;
  const CATEGORIES = ["Travel", "Lodging", "Meals", "Office", "Other"];
  const TRY_TASKS = ["try-list", "try-submit", "try-delete"];
  // Steps that show the assistant beside the guide.
  const APP_STEPS = ["try", "killswitch", "rules"];
  // The namespace the README installs into, for the tutorial alone: the
  // page offers to delete no other.
  const OWN_NAMESPACE = "hush-hosted-agent-tutorial";
  // Ticked from what the page finds now, never from an earlier visit: the
  // agent or its assignment may be gone since.
  const LIVE_STEPS = ["agent", "access"];

  let setup = null;
  // What the last Start over did, step by step, shown on Welcome until the reader moves on.
  let startedOver = null;
  // Why the last read of the agent's page failed, until one succeeds again.
  let setupError = null;
  let me = { signed_in: false };
  let step = initialStep();
  const done = new Set(load(DONE_KEY, []).filter((key) => !LIVE_STEPS.includes(key)));
  // Checks the reader ran: {pending} while asking, {checked} after.
  const checks = {};
  // Behind the scenes: the agent's calls for the user, and the user's
  // approval decisions. Expenses keep their description after they're gone.
  let activity = null;
  const described = new Map();
  let seenEvents = null;
  // Whether the reader opened the log's earlier events: a redraw keeps them so.
  let feedOpen = false;
  // Which expandable boxes the reader opened: a redraw keeps them so.
  const openBoxes = new Map();
  const box = (id) => ` data-box="${id}"${openBoxes.get(id) ? " open" : ""}`;
  const HOWTO_KEY = "hush-hosted-agent-tutorial-howto";
  let howtoOpen = load(HOWTO_KEY, false);

  // The assistant, as its user sees it.
  const app = {
    phase: "loading",     // signed_out, loading, connect, ready, unavailable, refused, error
    expenses: [],
    connectUrl: null,
    connecting: false,
    message: "",
    busy: null,           // "list", "submit", or "delete:<id>"
    notice: null,         // {tone, html, waiting}
    menuOpen: false,
    signinError: null,    // why the last sign-in, or the session, ended
    signinRefused: false, // Hush refused the sign-in, rather than the session ending
    signingIn: false,     // on the way to Hush's sign-in page
  };
  // Hush asked the user about the expense being added.
  let consentAsked = false;
  let consentTimer = null;
  let connectTimer = null;

  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (error) { return fallback; }
  }

  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) { /* kept for this page only */ }
  }

  function initialStep() {
    const fromHash = STEPS.findIndex((s) => `#${s.key}` === location.hash);
    if (fromHash >= 0) return fromHash;
    const saved = Number(load(STEP_KEY, 0));
    return saved >= 0 && saved < STEPS.length ? saved : 0;
  }

  function markDone(key) {
    if (done.has(key)) return;
    done.add(key);
    save(DONE_KEY, [...done]);
  }

  // Trying the assistant starts over with each sign-in.
  function forgetTries() {
    for (const key of [...TRY_TASKS, "try"]) done.delete(key);
    save(DONE_KEY, [...done]);
  }

  const isDone = (key) => key === "agent" ? registered() : key === "access" ? assigned() : done.has(key);

  // Replaces an element's content only when it changed: a poll that finds
  // nothing new leaves the reader's text selection and focus alone.
  const rendered = new WeakMap();
  function setHtml(element, html) {
    if (rendered.get(element) === html) return false;
    element.innerHTML = html;
    rendered.set(element, html);
    return true;
  }

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  // A value to type into the Hush UI, with its own copy button.
  const val = (text) => text
    ? `<span class="val"><code>${esc(text)}</code><button class="copy" type="button" data-copy="${esc(text)}">Copy</button></span>`
    : `<span class="val"><code>unknown</code></span>`;
  const cmd = (text) => `<div class="cmd"><code>${esc(text)}</code><button class="copy" type="button" data-copy="${esc(text)}">Copy</button></div>`;
  const fields = (rows, cls = "") => `<table class="fields ${cls}">${rows.map(([k, ...v]) => `<tr><th>${k}</th>${v.map((x) => `<td>${x}</td>`).join("")}</tr>`).join("")}</table>`;
  const spinner = `<span class="spin" aria-hidden="true"></span>`;
  const money = (amount) => Number(amount).toFixed(2);

  async function api(path, body) {
    const options = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    try {
      const response = await fetch(path, options);
      const reply = await response.json().catch(() => ({}));
      return response.ok ? reply : { kind: reply.not_assigned ? "not_assigned" : "error", message: reply.message || `HTTP ${response.status}`,
        ...reply, status: response.status };
    } catch (error) {
      const local = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
      return { kind: "error", message: `The agent's page is unreachable${local ? ": is kubectl port-forward still running?" : "."}` };
    }
  }

  const serviceAccount = (subject) => /^system:serviceaccount:([^:]+):(.+)$/.exec(subject || "") || [];
  const stepOf = (key) => STEPS.findIndex((s) => s.key === key);
  const goTo = (key, label) => `<button class="btn" type="button" data-step="${stepOf(key)}">${label}</button>`;
  const agentName = () => setup?.agent?.hush?.name || setup?.agent?.hush?.id;
  const appName = () => setup?.expenses?.in_hush?.display_name || "Expenses (tutorial)";
  const agentDisabled = () => setup?.agent?.hush?.disabled === true;
  // A disabled agent is still registered: Hush only won't let it act.
  const registered = () => Boolean(setup?.agent?.hush?.id) || agentDisabled();
  const assigned = () => setup?.expenses?.assigned?.assigned === true;
  const inHush = () => setup?.expenses?.in_hush || { state: "unknown" };

  // While the reader works in the Hush UI: the page checks by itself, and
  // "Check now" asks at once.
  function waitingFor(id, text) {
    const pending = checks[id]?.pending;
    return `<div class="row"><p class="status wait">${spinner}<span>${text}</span></p>
      <button class="linkbtn" type="button" data-check="${id}"${pending ? " disabled" : ""}>${pending ? "Checking…" : "Check now"}</button></div>`;
  }

  // Under an error the page retries by itself: say so, and offer to check now.
  function retrying(id) {
    const pending = checks[id]?.pending;
    return `<div class="row"><span class="note">${pending ? "Checking…" : "Retrying every few seconds."}</span>
      ${pending ? "" : `<button class="linkbtn" type="button" data-check="${id}">Check now</button>`}</div>`;
  }

  const unreachable = (id) => `<div class="result no" role="status"><span>${esc(setupError)}</span>${retrying(id)}</div>`;

  async function runCheck(id) {
    checks[id] = { pending: true };
    render();
    await Promise.all([loadSetup(), sleep(CHECK_MIN_MS)]);
    checks[id] = { checked: true };
    render();
  }

  function setupWarnings() {
    if (!setup) return "";
    const notes = [];
    const { agent, gateway } = setup;
    if (!agent.issuer) notes.push("The agent has no Kubernetes token: check its pod.");
    if (gateway.error) notes.push(`The agent can't read the gateway's sign-in details: ${esc(gateway.error)}`);
    else if (agent.issuer && !agent.audience.includes(gateway.issuer)) {
      const namespace = serviceAccount(agent.subject)[1] || "<namespace>";
      notes.push(`The agent's token is issued for <code>${esc(agent.audience.join(", "))}</code>. The gateway's issuer is
        <code>${esc(gateway.issuer)}</code>. Upgrade the chart with the gateway's issuer:
        ${cmd(`helm upgrade ${setup.release || "<release>"} oci://ghcr.io/hushsecurity/hush-hosted-agent-tutorial --version ${setup.chart_version || "<version>"} -n ${namespace} --reuse-values --set gateway.issuer=${gateway.issuer}`)}`);
    }
    return notes.map((n) => `<div class="warn">${n}</div>`).join("");
  }

  function inHushStatus() {
    const h = inHush();
    if (h.state === "ready") return `<p class="status ok">✓ <span>Hush has <b>${esc(appName())}</b>, on your gateway for all users.</span></p>`;
    if (h.state === "failed") return `<p class="warn">The tutorial couldn't put the Expenses service in Hush yet. It keeps trying. ${esc(h.error)}</p>`;
    if (h.state === "working") return `<p class="status wait">${spinner}<span>The tutorial is putting the Expenses service in Hush…</span></p>`;
    return `<p class="warn">Can't tell whether the Expenses service is in Hush: is the tutorial's setup pod running?</p>`;
  }

  // ---- Steps -------------------------------------------------------------------

  function storyWelcome() {
    return `
      ${startOverResult()}
      <h1>An agent that works for your users</h1>
      <p class="prereq"><span>You need admin access to the Hush UI</span><span>About 10 minutes</span></p>
      <p>A spend assistant runs in your cluster and keeps your expense reports up to date. It reaches the Expenses
        service, one of your company's apps, only through your Hush Identity Gateway.</p>
      <div class="diagram" role="img" aria-label="You use the assistant. The assistant reaches the Expenses service through the Hush Identity Gateway.">
        <span class="node">You</span><span class="arrow">→</span><span class="node app">Spend Assistant</span>
        <span class="arrow">→</span><span class="node hush">Hush Identity Gateway</span><span class="arrow">→</span>
        <span class="node">Expenses service</span></div>
      <h2>What you'll see</h2>
      <ul class="points">
        <li><span><b>No secret:</b> the agent proves who it is with its Kubernetes identity.</span></li>
        <li><span><b>Acts for the user:</b> each call names both the user and the agent.</span></li>
        <li><span><b>Access control:</b> the agent reaches only the apps assigned to it.</span></li>
        <li><span><b>Guardrails:</b> a read goes through, a write asks the user, a delete is blocked.</span></li>
      </ul>
      <h2>Already in place</h2>
      <p>Installing the tutorial set up the assistant and the Expenses service, and put the Expenses service in Hush as
        <b>${esc(appName())}</b>.</p>
      ${inHush().state === "ready" ? "" : inHushStatus()}
      <h2>What you'll do</h2>
      <ol class="tasks">
        <li><div>Register the agent in Hush.</div></li>
        <li><div>Grant it access to the Expenses service.</div></li>
        <li><div>Try the assistant as one of its users.</div></li>
      </ol>
      <p class="note">Then, if you like, two optional steps: switch the agent off, and choose who it works for.</p>
      <div class="nav-row"><button class="btn primary" type="button" data-step="${stepOf("agent")}">Start</button></div>`;
  }

  function startOverResult() {
    if (!startedOver) return "";
    const labels = { agent: "Unregister the agent", app: `Make ${esc(appName())} anew on the gateway`,
      expenses: "Reset the Expenses service", assistant: "Sign everyone out of the assistant" };
    const steps = Object.entries(labels).map(([key, label]) => [label, startedOver.steps[key] || { ok: false, detail: "no answer" }]);
    // ok null: left as it was, with a note for the reader. Not a failure.
    const all = steps.every(([, r]) => r.ok !== false);
    const mark = (r) => r.ok === true ? "✓" : r.ok === false ? "✕" : "–";
    return `<div class="result ${all ? "ok" : "wait"}" role="status"><span><b>${all ? "Started over." : "Started over, partly."}</b>
      ${all ? "Go through the steps again." : "Do what failed by hand, or start over again."}</span>
      <ul class="steps-done">${steps.map(([label, r]) => `<li>${mark(r)} ${label}: ${esc(r.detail)}</li>`).join("")}</ul></div>`;
  }

  async function startOver() {
    if (!confirm("Start over?\n\nThis unregisters the agent in Hush, makes " + appName() + " anew on the gateway " +
        "(no assignments, default tool policies), resets the Expenses service, and signs everyone out of the assistant.")) return;
    const button = document.getElementById("start-over");
    button.disabled = true;
    button.textContent = "Starting over…";
    const r = await api("/api/start-over", {});
    if (!r.steps) {
      // Nothing started over: the page stays as it was.
      button.disabled = false;
      button.textContent = "Start over";
      alert("Couldn't start over: " + (r.message || "no answer"));
      return;
    }
    startedOver = { steps: r.steps };
    // The page starts over too: signed out, nothing ticked, boxes as they start.
    signedOut();
    done.clear();
    save(DONE_KEY, []);
    for (const id of Object.keys(checks)) delete checks[id];
    openBoxes.clear();
    described.clear();
    howtoOpen = false;
    save(HOWTO_KEY, false);
    await loadSetup();
    button.disabled = false;
    button.textContent = "Start over";
    show(stepOf("welcome"));
  }

  function storyAgent() {
    const a = setup?.agent || {};
    const [, namespace, account] = serviceAccount(a.subject);
    const hush = a.hush || {};
    let result = "";
    if (setupError) {
      result = unreachable("agent");
    } else if (!setup) {
      result = "";
    } else if (registered()) {
      result = `<div class="result ok" role="status"><span>✓ Hush knows the agent${agentName() ? ` as <b>${esc(agentName())}</b>` : ""}.
        ${agentDisabled() ? "It's switched off right now." : ""}</span></div>`;
    } else if (!hush.unknown) {
      // Not "not registered yet": waiting wouldn't help, so say it at once.
      result = `<div class="result no" role="status"><span>Couldn't ask Hush about the agent.</span>
        <details class="detail"${box("agent-error")}><summary>Details</summary>${esc(hush.reason || hush.error || "No answer.")}</details>
        ${retrying("agent")}</div>`;
    } else {
      result = waitingFor("agent", "Waiting for you to register the agent in Hush…");
      if (checks.agent?.checked) {
        result += `<div class="result no" role="status"><span>Not found yet. Check that the values above match.</span>
          <details class="detail"${box("agent-unknown")}><summary>Details</summary>${esc(hush.reason || hush.error)}</details></div>`;
      }
    }
    return `
      <h1>Register the agent</h1>
      <p>Hush knows the agent by its Kubernetes identity, so the agent holds no secret.</p>
      <ol class="tasks">
        <li><div>In the Hush UI, go to <b>Access › Agents › Registry</b> and click <b>Register Agent</b>.</div></li>
        <li><div>Name it: ${val(account || "spend-assistant")}</div></li>
        <li><div>Turn on <b>Act for users</b>. It lets the agent work for signed-in users.</div></li>
        <li><div>In its <b>Authentication</b> tab, click <b>Add Authentication</b> and choose <b>Kubernetes</b>. Fill in:
          ${fields([["Cluster issuer", val(a.issuer)], ["Namespace", val(namespace)], ["Service account", val(account)]], "card")}</div></li>
      </ol>
      ${setupWarnings()}
      ${result}
      <div class="nav-row">
        ${goTo("welcome", "Back")}
        <button class="btn${registered() ? " primary" : ""}" type="button" data-step="${stepOf("access")}">Next</button>
      </div>`;
  }

  function storyAccess() {
    const e = setup?.expenses || {};
    const a = e.assigned || {};
    let result = "";
    if (setupError) {
      result = unreachable("access");
    } else if (!setup) {
      result = "";
    } else if (assigned()) {
      result = `<div class="result ok" role="status"><span>✓ ${esc(appName())} is assigned to ${agentName() ? `<b>${esc(agentName())}</b>` : "the agent"}.</span></div>`;
    } else if (!registered()) {
      result = `<div class="result no" role="status"><span>Register the agent first.</span>
        <div class="row">${goTo("agent", "Go to Register the agent")}</div></div>`;
    } else if (agentDisabled()) {
      result = `<div class="result no" role="status"><span>The agent is switched off in Hush. Turn its <b>Enabled</b>
        switch back on, in <b>Access › Agents › Registry</b>, to check its access.</span></div>`;
    } else if (a.error) {
      // Not "not assigned yet": waiting wouldn't help, so say it at once.
      result = `<div class="result no" role="status"><span>Couldn't read ${esc(appName())}'s assignments.</span>
        <details class="detail"${box("access-error")}><summary>Details</summary>${esc(a.error)}</details>
        ${retrying("access")}</div>`;
    } else {
      result = waitingFor("access", "Waiting for you to assign it in Hush…");
      if (checks.access?.checked && a.assigned === false) {
        result += `<div class="result no" role="status"><span>${esc(appName())} isn't assigned to <b>${esc(agentName())}</b> yet.</span></div>`;
      }
    }
    const policy = { allowed: ["ok", "✓"], asks: ["wait", "?"], blocked: ["no", "✕"] };
    return `
      <h1>Grant the agent access to the Expenses service</h1>
      ${inHush().state === "ready" ? "" : inHushStatus()}
      <p>Agents need their own access to each app:</p>
      <ol class="tasks">
        <li><div>In the Hush UI, go to <b>Access › Agents › Applications</b> and open <b>${esc(appName())}</b>.</div></li>
        <li><div>In its <b>Assignments</b> tab, click <b>Add</b> and pick ${agentName() ? `<b>${esc(agentName())}</b>` : "your agent"}.</div></li>
      </ol>
      ${result}
      <details class="policies-box"${box("policies")}><summary>Tool policies: the defaults, no change needed</summary>
        <p>Hush gives each tool a policy by what it does.</p>
        <table class="fields policies"><thead><tr><th>Tool</th><th>What it does</th><th>Default policy</th></tr></thead>
          <tbody>${[
            ["list_expenses", "reads", "allowed", "Allowed"],
            ["submit_expense", "writes", "asks", "Asks the user"],
            ["delete_expense", "deletes", "blocked", "Blocked"],
          ].map(([tool, does, kind, said]) => `<tr><th><code>${tool}</code></th><td>${does}</td>
            <td><span class="badge ${policy[kind][0]}">${policy[kind][1]} ${said}</span></td></tr>`).join("")}</tbody></table>
      </details>
      <div class="nav-row">
        ${goTo("agent", "Back")}
        <button class="btn${assigned() ? " primary" : ""}" type="button" data-step="${stepOf("try")}">Next</button>
      </div>`;
  }

  // Where the reader is in trying the assistant, from the assistant's state.
  function tryPart() {
    if (!me.signed_in) return "signin";
    if (app.phase === "ready") return "use";
    return "connect";
  }

  // What stops the assistant, past signing in: not a step of its own.
  function tryProblem() {
    if (!me.signed_in) return "";
    if (app.phase === "disabled") {
      return `<div class="result no" role="status"><span>The agent is switched off in Hush. Turn its <b>Enabled</b>
        switch back on in <b>Access › Agents › Registry</b>.</span></div>`;
    }
    if (app.phase === "unavailable") {
      return `<div class="result no" role="status"><span>The assistant has no access to the Expenses service. Assign it in
        Grant access.</span><div class="row">${goTo("access", "Go to Grant access")}</div></div>`;
    }
    if (app.phase === "refused") {
      return `<div class="result no" role="status"><span>Hush won't let the assistant act for you.</span>
        <span>In the Hush registry, check that <b>Act for users</b> is on, and that you're one of its users.</span></div>`;
    }
    if (app.phase === "error") {
      return `<div class="result no" role="status"><span>The assistant couldn't reach the Expenses service.</span>
        <span class="detail">${esc(app.message)}</span></div>`;
    }
    return "";
  }

  function storyTry() {
    const part = tryPart();
    const problem = tryProblem();
    const now = { signin: ["Sign in", trySignIn], connect: ["Connect the Expenses service", tryConnect],
      use: ["Try three actions", tryUse] }[part];
    return `
      <div class="try-head">
        <h1>Try the assistant</h1>
        <p>Use the assistant as your users would. Beside it, see what Hush does with each call.</p>
      </div>
      <div class="try-guide">
        ${problem || `<div class="guide"><h3>Now: ${now[0]}</h3>${now[1]()}</div>`}
        <div class="nav-row">
          ${goTo("access", "Back")}
          <button class="btn${done.has("try") ? " primary" : ""}" type="button" data-step="${stepOf("recap")}">Next</button>
        </div>
      </div>`;
  }

  function trySignIn() {
    return `<p>Click <b>Sign in</b> in the assistant, and use your company account.</p>
      ${app.signinError ? `<div class="result no" role="status"><span>${app.signinRefused
        ? "Hush refused the last sign-in." : "The assistant no longer has your sign-in."}</span>
        <span class="detail">${esc(app.signinError)}</span></div>` : ""}`;
  }

  function tryConnect() {
    const e = setup?.expenses || {};
    if (app.phase !== "connect") return `<p class="status wait">${spinner}<span>The assistant is reaching the Expenses service…</span></p>`;
    return `
      <p>The Expenses service has its own accounts. Connect yours once. Hush keeps the connection, and the assistant
        never sees it.</p>
      <p>Click <b>Connect the Expenses service</b> in the assistant. Its sign-in asks for:</p>
      ${fields([["Email", val(me.email)], ...(e.access_code ? [["Access code", val(e.access_code)]] : [])])}
      ${e.access_code ? `<p class="aside">The access code keeps strangers out of this demo app.</p>` : ""}`;
  }

  function tryUse() {
    const tasks = [
      ["try-list", "See your expenses", "a read: allowed by default"],
      ["try-submit", "Add an expense", "a write: asks the user first, by default"],
      ["try-delete", "Delete an expense", "a delete: blocked by default"],
    ];
    const next = tasks.find(([key]) => !done.has(key))?.[0];
    return `
      <ol class="checklist">${tasks.map(([key, title, why], i) =>
        `<li class="${done.has(key) ? "yes" : key === next ? "next" : ""}"><span class="tick">${done.has(key) ? "✓" : i + 1}</span>
          <span>${title} <span class="why">· ${why}</span></span></li>`).join("")}</ol>
      ${consentAsked ? `<div class="result wait"><span>Adding needs your OK. Click <b>Review the request</b> in the
        assistant and approve it. The assistant then adds it again.</span>
        <span>If Hush asks for how long, choose <b>10 minutes</b>. Until your approval expires, Hush won't ask again.</span></div>` : ""}
      ${next ? "" : `<div class="result ok"><span>That's the whole flow. Next, a recap, or first two optional steps.</span>
        <div class="row">${goTo("killswitch", "Kill switch")} ${goTo("rules", "Who it works for")}</div></div>`}`;
  }

  function storyRecap() {
    const namespace = serviceAccount(setup?.agent?.subject)[1] || "<namespace>";
    const release = setup?.release || "<release>";
    return `
      <h1>Recap</h1>
      ${agentDisabled() ? `<div class="warn">The agent is still switched off in Hush. Turn its <b>Enabled</b> switch back
        on in <b>Access › Agents › Registry</b>.</div>` : ""}
      <ul class="points">
        <li><span><b>No secret:</b> the assistant used only its Kubernetes identity.</span></li>
        <li><span><b>Acts for you:</b> every call named both you and the assistant.</span></li>
        <li><span><b>Access control:</b> it reached the Expenses service only after you assigned it.</span></li>
        <li><span><b>Guardrails:</b> listing went through, adding waited for you, deleting was blocked.</span></li>
        <li><span><b>Kill switch:</b> one switch stops the agent at once, for every user, on every app.</span></li>
        <li><span><b>Who it works for:</b> each app's assignment names the users the agent may act for there.</span></li>
      </ul>
      <h2>Clean up</h2>
      <p>Do it before your API key expires: uninstalling uses it to take the Expenses service out of Hush.</p>
      <ol class="tasks">
        <li><div>Uninstall the tutorial: ${cmd(`helm uninstall ${release} -n ${namespace}`)}</div></li>
        ${namespace === OWN_NAMESPACE ? `<li><div>Delete its namespace: ${cmd(`kubectl delete namespace ${namespace}`)}</div></li>` : ""}
        <li><div>In the Hush UI, delete the agent, in <b>Access › Agents › Registry</b>.</div></li>
        <li><div>Delete the API key, unless it has expired.</div></li>
      </ol>
      <div class="nav-row">${goTo("rules", "Back")}</div>`;
  }

  // An optional step: its own guide beside the assistant.
  function extraStep(title, intro, guide, back, nextKey) {
    // What the step itself brings about isn't a problem to point out.
    const expected = { killswitch: "disabled", rules: "unavailable" }[STEPS[step].key];
    const first = !me.signed_in ? `<div class="guide"><h3>Sign in first</h3>${trySignIn()}</div>`
      : app.phase === "connect" ? `<div class="guide"><h3>Connect the Expenses service first</h3>${tryConnect()}</div>` : "";
    const problem = me.signed_in && app.phase !== expected ? tryProblem() : "";
    return `
      <div class="try-head">
        <h1>${title}</h1>
        <p class="prereq"><span>Optional</span><span>About 2 minutes</span></p>
        <p>${intro}</p>
      </div>
      <div class="try-guide">
        ${first || `${problem}<div class="guide">${guide}</div>`}
        <div class="nav-row">${goTo(back, "Back")}
          <button class="btn" type="button" data-step="${stepOf(nextKey)}">Next</button></div>
      </div>`;
  }

  function storyKillswitch() {
    return extraStep("Kill switch",
      "One switch in Hush stops the agent at once: for every user, on every app. Nothing to revoke, rotate or redeploy.",
      `<ol class="tasks">
        <li><div>In the Hush UI, go to <b>Access › Agents › Registry</b>. Find
          <b>${esc(agentName() || "spend-assistant")}</b> and set its <b>Enabled</b> switch to <b>off</b>.</div></li>
        <li><div>Click refresh in the assistant. Hush refuses the agent before it reaches any app.</div></li>
        <li><div>Set <b>Enabled</b> back to <b>on</b>.</div></li>
        <li><div>Click <b>Try again</b> in the assistant. It works at once.</div></li>
      </ol>
      ${agentDisabled() ? `<p class="status no"><span>Right now, the agent is <b>switched off</b>.</span></p>`
        : registered() ? `<p class="status ok"><span>Right now, the agent is <b>on</b>.</span></p>` : ""}`,
      "try", "rules");
  }

  function storyRules() {
    return extraStep("Choose who it works for",
      "Hush lets the agent reach an app only for the users you name. Leave yourself out, then let only yourself in.",
      `<ol class="tasks">
        <li><div>In the Hush UI, open <b>Access › Agents › Applications</b>, then <b>${esc(appName())}</b> and its <b>Assignments</b> tab.</div></li>
        <li><div>Edit the assignment to <b>${esc(agentName() || "the agent")}</b>, and switch <b>Assign to all users</b> to <b>off</b>.</div></li>
        <li><div>Click <b>Add › Custom rule</b>, and set it to:
          ${fields([["Email", "is not"], ["Value", val(me.email)]], "card")}
          <p class="then">Then click outside the rule to apply it.</p></div></li>
        <li><div>Click refresh in the assistant: Hush no longer offers it the Expenses service for you.</div></li>
        <li><div>Change the rule to <b>is</b>, and click outside it to apply it.</div></li>
        <li><div>Click <b>Try again</b> in the assistant: it works again, for you alone.</div></li>
      </ol>
      <p class="aside">When you're done, only you can use the assistant on ${esc(appName())}. <b>Start over</b>, at
        the top, puts it back as installed.</p>
      <p class="aside">Hush can also limit who the agent works for at all, on every app: in the Registry, the agent's
        <b>Assignment Rules</b>.</p>`,
      "killswitch", "recap");
  }

  const STORIES = { welcome: storyWelcome, agent: storyAgent, access: storyAccess, try: storyTry,
    killswitch: storyKillswitch, rules: storyRules, recap: storyRecap };

  // ---- The assistant -------------------------------------------------------------

  const ICONS = {
    logo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>`,
    trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`,
    refresh: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>`,
    close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
    lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`,
    plug: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg>`,
  };

  // What the guide asks the reader to click next in the assistant, if anything.
  function nextTarget() {
    // The optional steps start in the Hush UI.
    if (STEPS[step].key !== "try") return null;
    if (!me.signed_in) return "signin";
    if (app.phase === "connect") return app.connecting ? null : "connect";
    if (app.phase !== "ready" || consentAsked) return null;
    // Not the trash icons: a pulse on one row reads as "delete this one".
    return { "try-list": "list", "try-submit": "submit" }[TRY_TASKS.find((k) => !done.has(k))] || null;
  }
  const hint = (target) => nextTarget() === target ? " hint" : "";

  const firstName = () => (me.name || "").split(/\s+/)[0] || (me.email || "").split("@")[0];
  const initials = () => {
    const words = (me.name || me.email || "?").split(/[\s@.]+/).filter(Boolean);
    return (words[0]?.[0] || "?").toUpperCase() + (words[1]?.[0] || "").toUpperCase();
  };

  function renderApp() {
    const bar = `<div class="appbar"><span class="applogo">${ICONS.logo}</span>
      <span class="appname"><b>Spend Assistant</b><small>Your AI expenses helper</small></span>
      ${me.signed_in ? `<details class="menu" id="app-menu"${app.menuOpen ? " open" : ""}>
        <summary class="avatar" aria-label="Account">${esc(initials())}</summary>
        <div class="menu-pop"><span class="who"><b>${esc(me.name || me.email)}</b>${me.name ? `<span>${esc(me.email)}</span>` : ""}</span>
          <button class="abtn ghost small" type="button" data-app="signout">Sign out</button></div></details>` : ""}</div>`;
    const kept = ["x-description", "x-amount", "x-category"].map((id) => [id, document.getElementById(id)?.value]);
    if (!setHtml(document.getElementById("app"), bar + appBody())) return;
    for (const [id, value] of kept) {
      const input = document.getElementById(id);
      if (input && value !== undefined) input.value = value;
    }
  }

  function appBody() {
    const center = (icon, title, text, actions = "") => `<div class="appbody center"><span class="hero">${icon}</span>
      <h3>${title}</h3><p>${text}</p>${actions}</div>`;
    const retry = `<button class="abtn ghost" type="button" data-app="list">Try again</button>`;
    switch (app.phase) {
      case "signed_out":
        return center(ICONS.logo, "Your expense reports, handled",
          "I keep your expense reports up to date: I list them, add new ones and tidy up old ones, for you.",
          `${app.signinError ? `<p class="fine">${esc(app.signinError)}</p>` : ""}
          ${app.signingIn ? `<a class="abtn" href="/signin" data-signin aria-busy="true">${spinner}Signing in…</a>`
            : `<a class="abtn${hint("signin")}" href="/signin" data-signin>Sign in with your company account</a>`}`);
      case "loading":
        return `<div class="appbody center"><span class="spin" aria-hidden="true"></span><p>Opening your expenses…</p></div>`;
      case "connect":
        return center(ICONS.plug, `Hi ${esc(firstName())}!`,
          "To work on your expense reports, I need your account on the Expenses service. You connect it once.",
          app.connecting
            ? `<p class="status wait">${spinner}<span>Waiting for you to finish in the Expenses service…</span></p>
              <button class="abtn ghost small" type="button" data-app="list">Done? Check now</button>`
            : `<button class="abtn${hint("connect")}" type="button" data-app="connect"${app.connectUrl ? "" : " disabled"}>Connect the Expenses service</button>`);
      case "unavailable":
        return center(ICONS.lock, "I can't reach the Expenses service for you",
          "Your company hasn't given me access to the Expenses service for you.", retry);
      case "disabled":
        return center(ICONS.lock, "I've been switched off",
          "Your company turned me off. I can't do anything for anyone until it turns me back on.", retry);
      case "refused":
        return center(ICONS.lock, "I can't work for you",
          "Your company hasn't allowed me to act for you.", retry);
      case "error":
        return center(ICONS.lock, "Something went wrong", "I couldn't reach the Expenses service.", `<span class="fine">${esc(app.message)}</span>${retry}`);
      default:
        return appReady();
    }
  }

  function appReady() {
    const rows = Array.isArray(app.expenses) ? app.expenses : [];
    const total = rows.reduce((sum, x) => sum + Number(x.amount || 0), 0);
    const n = app.notice;
    const busy = app.busy !== null;
    return `<div class="appbody">
      <div class="greet"><h3>Hi ${esc(firstName())}, here are your expenses</h3>
        <button class="icon-btn${hint("list")}" type="button" data-app="list" aria-label="Refresh"${busy ? " disabled" : ""}>${app.busy === "list" ? spinner : ICONS.refresh}</button></div>
      ${n ? `<div class="bubble ${n.tone}" role="status">${n.waiting ? spinner : ""}<span class="text">${n.html}</span>
        ${n.waiting ? "" : `<button class="icon-btn" type="button" data-app="dismiss" aria-label="Dismiss">${ICONS.close}</button>`}</div>` : ""}
      <ul class="items">
        ${rows.length ? rows.map((x) => `<li><span class="what"><b>${esc(x.description)}</b><span>${esc(x.category)}${x.date ? ` · ${esc(x.date)}` : ""}</span></span>
          <span class="amt">${esc(money(x.amount))}</span>
          <button class="icon-btn" type="button" data-app="delete" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.description)}"${busy ? " disabled" : ""}>
            ${app.busy === `delete:${x.id}` ? spinner : ICONS.trash}</button></li>`).join("")
          + `<li class="total"><span class="what">Total</span><span class="amt">${esc(money(total))}</span></li>`
          : `<li class="none">No expenses yet.</li>`}
      </ul>
      <form class="add" id="add-form">
        <h4>Add an expense</h4>
        <label class="wide">Description<input id="x-description" value="Hotel" required></label>
        <label>Category<select id="x-category">${CATEGORIES.map((c) => `<option${c === "Lodging" ? " selected" : ""}>${c}</option>`).join("")}</select></label>
        <label>Amount<input id="x-amount" value="210" inputmode="decimal" required></label>
        <button class="abtn${hint("submit")}" type="submit"${busy ? " disabled" : ""}>${app.busy === "submit" ? spinner : ""}Add</button>
      </form>
    </div>`;
  }

  // What a call through the gateway came to, for everything but its own success.
  function setPhaseFrom(r) {
    switch (r.kind) {
      case "connect": app.phase = "connect"; app.connectUrl = r.url; return;
      case "not_available": app.phase = "unavailable"; return;
      case "not_assigned": app.phase = "refused"; return;
      case "disabled": app.phase = "disabled"; return;
      case "signed_out": signedOut(r.message); return;
      default:
        if (r.error === "login_required") { signedOut(r.message); return; }
        app.phase = "error"; app.message = r.message || "Something went wrong.";
    }
  }

  async function appList({ quiet = false } = {}) {
    if (!quiet) { app.busy = "list"; if (app.phase !== "ready" && app.phase !== "connect") app.phase = "loading"; render(); }
    const r = await api("/api/expenses/list", {});
    if (!me.signed_in) return;
    app.busy = null;
    if (r.kind === "done") {
      app.phase = "ready";
      app.expenses = r.data;
      for (const x of Array.isArray(r.data) ? r.data : []) described.set(String(x.id), x.description);
      stopConnecting();
      markDone("try-list");
    } else if (!(quiet && r.kind === "connect")) {
      setPhaseFrom(r);
    }
    render();
    refreshFeed();
  }

  function startConnecting() {
    if (app.connectUrl) window.open(app.connectUrl, "_blank", "noopener");
    app.connecting = true;
    render();
    let polls = 0;
    clearInterval(connectTimer);
    connectTimer = setInterval(() => {
      if (++polls > CONNECT_POLLS) { stopConnecting(); render(); return; }
      if (!document.hidden) appList({ quiet: true });
    }, CONNECT_POLL_MS);
  }

  function stopConnecting() {
    clearInterval(connectTimer);
    app.connecting = false;
  }

  // The agent no longer has the user's sign-in: back to signing in.
  function signedOut(message = null) {
    me = { signed_in: false };
    activity = null;
    clearTimeout(consentTimer);
    stopConnecting();
    Object.assign(app, { phase: "signed_out", expenses: [], notice: null, busy: null, menuOpen: false,
      signinError: message, signinRefused: false });
    consentAsked = false;
    feedOpen = false;
    forgetTries();
    renderFeed();
  }

  async function appSubmit(draft) {
    app.busy = "submit";
    app.notice = null;
    render();
    const r = await api("/api/expenses/submit", draft);
    if (!me.signed_in) return;
    app.busy = null;
    const what = `“${esc(draft.description)}” (${esc(money(draft.amount))})`;
    if (r.kind === "done") {
      app.notice = { tone: "ok", html: `Added ${what}.` };
      consentAsked = false;
      markDone("try-submit");
      return appList({ quiet: true });
    }
    if (r.kind === "consent") {
      app.notice = { tone: "wait", waiting: Boolean(r.request_id), html: `I need your OK before I add ${what}.
        ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Review the request</a>` : "Approve it where Hush asks you."}
        ${r.request_id ? "" : " Then add it again."}` };
      consentAsked = true;
      if (r.request_id) waitForConsent(r.request_id, draft);
    } else if (r.kind === "blocked") {
      app.notice = { tone: "no", html: "I'm not allowed to add expenses: your company's policy blocks it." };
    } else if (r.kind === "error") {
      app.notice = { tone: "no", html: `I couldn't add it: ${esc(r.message)}` };
    } else {
      setPhaseFrom(r);
    }
    render();
    refreshFeed();
  }

  // Asks Hush, through the agent, until the request is decided; then adds it
  // again, as the next exchange carries the approval.
  function waitForConsent(requestId, draft) {
    clearTimeout(consentTimer);
    consentTimer = setTimeout(async () => {
      const r = await api(`/api/consent/${encodeURIComponent(requestId)}`);
      if (!me.signed_in) return;
      if (r.status === "pending") return waitForConsent(requestId, draft);
      if (r.status === "granted") return appSubmit(draft);
      if (r.error === "login_required") { signedOut(r.message); render(); return; }
      app.notice = r.status === "denied"
        ? { tone: "no", html: "You declined, so I didn't add it." }
        : r.status === "expired"
          ? { tone: "no", html: "The approval request expired. Add it again to ask again." }
          : { tone: "no", html: `I couldn't tell whether you approved: ${esc(r.message)}` };
      consentAsked = false;
      render();
    }, CONSENT_POLL_MS);
  }

  async function appDelete(id) {
    const expense = app.expenses.find((x) => String(x.id) === String(id));
    const what = expense ? `“${esc(expense.description)}”` : "it";
    app.busy = `delete:${id}`;
    app.notice = null;
    render();
    const r = await api("/api/expenses/delete", { expense_id: id });
    if (!me.signed_in) return;
    app.busy = null;
    if (r.kind === "blocked") {
      app.notice = { tone: "no", html: `I'm not allowed to delete ${what}: your company's policy blocks deleting expenses.` };
      markDone("try-delete");
    } else if (r.kind === "done") {
      app.notice = { tone: "ok", html: `Deleted ${what}.` };
      return appList({ quiet: true });
    } else if (r.kind === "consent") {
      app.notice = { tone: "wait", html: `I need your OK before I delete ${what}.
        ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Review the request</a>, then` : "Approve it, then"} delete it again.` };
    } else if (r.kind === "error") {
      app.notice = { tone: "no", html: `I couldn't delete ${what}: ${esc(r.message)}` };
    } else {
      setPhaseFrom(r);
    }
    render();
    refreshFeed();
  }

  // ---- Behind the scenes --------------------------------------------------------

  async function refreshFeed() {
    if (!me.signed_in) { activity = null; renderFeed(); return; }
    const a = await api("/api/activity");
    if (!me.signed_in) return;
    if (Array.isArray(a.events)) activity = a.events;
    renderFeed();
  }

  const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  // What the assistant did, in the user's words.
  function action(ev) {
    if (ev.kind === "decision") return "";
    if (ev.kind === "signin") return "You signed in to the assistant";
    const a = ev.arguments || {};
    if (ev.tool === "list_expenses") return "List your expenses";
    if (ev.tool === "submit_expense") return `Add “${esc(a.description)}”, ${esc(money(a.amount))}`;
    if (ev.tool === "delete_expense") {
      const description = described.get(String(a.expense_id));
      return description ? `Delete “${esc(description)}”` : `Delete expense ${esc(a.expense_id)}`;
    }
    return esc(ev.tool);
  }

  // What Hush decided, in a few words; a note only when something is off;
  // and whether it's what the tutorial set out to show. The badge's colour is
  // the decision alone: a block is red, even when it's the one expected.
  function decision(ev) {
    if (ev.kind === "signin") {
      return ["id", "Signed you in for the assistant", `${ev.email ? `As ${esc(ev.email)}, so` : "So"} it can act for you`];
    }
    if (ev.kind === "decision") {
      if (ev.decision === "granted") return ["ok", "You approved", "The assistant adds it again, now with your approval."];
      if (ev.decision === "denied") return ["no", "You declined", "So the assistant doesn't add it."];
      return ["wait", "The request expired", "Add it again to ask again."];
    }
    switch (ev.outcome) {
      case "done":
        if (ev.approval === "just") return ["ok", "Allowed, after your approval"];
        if (ev.approval === "earlier") return ["ok", "Allowed: you approved earlier"];
        if (ev.tool === "delete_expense") return ["ok", "Allowed", "Is <code>delete_expense</code> still blocked in Hush?"];
        if (ev.tool === "submit_expense") return ["ok", "Allowed without asking",
          "Hush didn't ask: an approval you gave earlier may still be valid, or <code>submit_expense</code> isn't set to ask."];
        return ["ok", "Allowed"];
      case "consent": return ["wait", "Waiting for your approval"];
      case "blocked": return ["no", "Blocked by policy", "", ev.tool === "delete_expense"];
      case "connect": return ["wait", "Needs your Expenses login"];
      case "not_available": return ["no", "Not offered to the agent", `Is ${esc(appName())} assigned to the agent, for you?`];
      case "not_assigned": return ["no", "Refused", ev.exchange?.error
        ? `Hush refused the token exchange: ${esc(ev.exchange.error)}` : `Hush refused: ${esc(ev.message)}`];
      case "disabled": return ["no", "Agent disabled", "Hush refused the agent: it's switched off."];
      case "signed_out": return ["no", "Signed out", esc(ev.message)];
      case "refused": return ["no", "Refused", `Hush answered: ${esc(ev.message)}`];
      default: return ["no", "Failed", esc(ev.exchange?.error ? `The token exchange failed: ${ev.exchange.error}` : ev.message)];
    }
  }

  // Whether the call reached the Expenses service, and on which of its
  // accounts: the one the user connected, which needn't be their Hush email.
  // Its cell's class goes with it: none for an event not about a call.
  function reached(ev) {
    if (ev.kind === "decision" || ev.kind === "signin") return ["none", ""];
    if (ev.outcome !== "done") return ["gone", "not reached"];
    const did = { list_expenses: "Listed", submit_expense: "Added", delete_expense: "Deleted" }[ev.tool] || "Done";
    const account = ev.seen?.account;
    const other = account && me.email && account.toLowerCase() !== me.email.toLowerCase();
    return ["", `<span class="served">✓ ${did}</span>${account ? `<span class="s">as ${esc(account)}</span>` : ""}
      ${other ? `<span class="s">That's the account you connected, not your Hush email.</span>` : ""}`];
  }

  // Told once: how every call reaches the Expenses service.
  function howto() {
    const c = (activity || []).find((ev) => ev.exchange?.claims)?.exchange.claims;
    const act = c && (typeof c.act === "object" ? c.act.sub : c.act);
    return `<details class="howto" id="howto"${howtoOpen ? " open" : ""}><summary>How it works</summary>
      <p>Before every call, the agent makes a token exchange at Hush. It trades two tokens for one that names you both:</p>
      <div class="flow"><span class="tok">the agent's platform token</span>+<span class="tok">your Hush access token</span>
        →<b>Hush</b>→<span class="tok out">a Hush access token for you and the agent</span></div>
      ${c ? `<div class="claims"><span class="k">You</span><span class="v">${esc(c.sub)} <span>sub</span></span>
        ${c.email ? `<span class="k">Your email</span><span class="v">${esc(c.email)} <span>email</span></span>` : ""}
        <span class="k">Acting for you</span><span class="v">${esc(agentName() || act)} <span>act</span></span></div>` : ""}
      <p>The gateway checks that token and the tool's policy. Then it calls the Expenses service with your own connection.</p>
    </details>`;
  }

  function renderFeed() {
    const box = document.getElementById("feed");
    if (!me.signed_in) {
      setHtml(box, `${howto()}<p class="empty">Sign in to the assistant: each call it makes for you shows up here.</p>`);
      return;
    }
    const fresh = (ev) => seenEvents && !seenEvents.has(`${ev.id}:${ev.repeats}`);
    const rows = (activity || []).map((ev) => {
      const [tone, said, note, expected] = decision(ev);
      const [served, service] = reached(ev);
      const did = action(ev);
      return `<tr${fresh(ev) ? ` class="new"` : ""}><td class="when" data-l="Time">${esc(clock(ev.time))}</td>
        <td class="${did ? "pass" : "none"}" data-l="Assistant">${did ? `<b>${did}</b>` : ""}</td>
        <td class="${served === "" ? "pass" : ""}" data-l="Hush"><span class="badge ${tone}">${said}${ev.repeats > 1 ? ` ×${ev.repeats}` : ""}</span>
          ${expected ? `<span class="expect">✓ as expected</span>` : ""}
          ${note ? `<span class="s">${note}${/[.?!]$/.test(note) ? "" : "."}</span>` : ""}</td>
        <td class="${served}" data-l="Service">${service}</td></tr>`;
    });
    const earlier = rows.slice(0, Math.max(0, rows.length - FEED_RECENT));
    const more = earlier.length ? `<tbody class="more"><tr><td colspan="4"><button type="button" data-feed-more
      aria-expanded="${feedOpen}"><span class="caret" aria-hidden="true">▸</span>${feedOpen ? "Hide earlier events"
      : `${earlier.length} earlier event${earlier.length === 1 ? "" : "s"}`}</button></td></tr></tbody>
      ${feedOpen ? `<tbody>${earlier.join("")}</tbody>` : ""}` : "";
    const table = `<div class="feed-scroll"><table class="feed"><colgroup><col class="c-when"><col><col><col></colgroup><thead><tr><th>Time</th>
      <th><span class="sw app"></span>Assistant</th><th><span class="sw hush"></span>Hush</th>
      <th><span class="sw svc"></span>Expenses service</th></tr></thead>${more}<tbody>${rows.slice(earlier.length).join("")}</tbody></table></div>`;
    setHtml(box, `${howto()}${rows.length ? table : `<p class="empty">Each call the assistant makes for you shows up here.</p>`}
      <p class="aside">Hush records every call too: in the Hush UI, open <b>Access › Agents › Applications</b>, then
        <b>${esc(appName())}</b>, and its <b>Activity</b> tab.</p>`);
    seenEvents = new Set((activity || []).map((ev) => `${ev.id}:${ev.repeats}`));
  }

  // ---- Page ----------------------------------------------------------------------

  function render() {
    const key = STEPS[step].key;
    if (key === "welcome" || key === "recap") markDone(key);
    if (TRY_TASKS.every((k) => done.has(k))) markDone("try");
    const numbered = ["agent", "access", "try"];
    setHtml(document.getElementById("stepbar"), STEPS.map((s, i) => {
      const n = numbered.indexOf(s.key) + 1;
      const finished = !s.optional && isDone(s.key);
      const mark = finished && i !== step ? "✓" : n || "";
      return `<li><button type="button" data-step="${i}" class="${finished ? "done" : ""}"${i === step ? ` aria-current="step"` : ""}>
        ${mark ? `<span class="n">${mark}</span>` : ""}${esc(s.title)}${s.optional ? ` <span class="opt">optional</span>` : ""}</button></li>`;
    }).join(""));

    const trying = APP_STEPS.includes(key);
    document.getElementById("layout").classList.toggle("with-app", trying);
    document.getElementById("app-col").hidden = !trying;
    document.getElementById("behind").hidden = !trying;
    setHtml(document.getElementById("story"), STORIES[key]());
    if (trying) {
      renderApp();
      renderFeed();
    }
  }

  function show(index) {
    if (index !== stepOf("welcome")) startedOver = null;
    step = index;
    save(STEP_KEY, step);
    history.replaceState(null, "", `#${STEPS[step].key}`);
    render();
    window.scrollTo({ top: 0 });
    if (APP_STEPS.includes(STEPS[step].key)) {
      if (me.signed_in && app.phase === "loading" && app.busy !== "list") appList();
      refreshFeed();
    }
  }

  document.addEventListener("click", async (event) => {
    // Hush, then the company's sign-in page, can take a moment to show: say it started.
    const elsewhere = event.ctrlKey || event.metaKey || event.shiftKey || event.altKey;
    if (event.target.closest("a[data-signin]") && !elsewhere) {
      app.signingIn = true;
      // The busy button is a link too, to click again should the reader stop
      // the page: keep keyboard focus on it.
      const focused = document.activeElement?.matches("a[data-signin]");
      // After the link has navigated: a link taken out of the page doesn't.
      setTimeout(() => {
        render();
        if (focused) document.querySelector("a[data-signin]")?.focus();
      });
      return;
    }
    const target = event.target.closest("button");
    if (!target) return;
    if (target.dataset.copy !== undefined) {
      try { await navigator.clipboard.writeText(target.dataset.copy); target.textContent = "Copied"; }
      catch (error) { target.textContent = "Copy failed"; }
      setTimeout(() => { target.textContent = "Copy"; }, 1500);
    } else if (target.dataset.step !== undefined) {
      show(Number(target.dataset.step));
    } else if (target.dataset.feedMore !== undefined) {
      feedOpen = !feedOpen;
      renderFeed();
      // The redraw replaced the button: keep keyboard focus on it.
      document.querySelector("[data-feed-more]")?.focus();
    } else if (target.dataset.startOver !== undefined) {
      startOver();
    } else if (target.dataset.check) {
      runCheck(target.dataset.check);
    } else if (target.dataset.app === "list") {
      appList();
    } else if (target.dataset.app === "connect") {
      startConnecting();
    } else if (target.dataset.app === "delete") {
      appDelete(target.dataset.id);
    } else if (target.dataset.app === "dismiss") {
      app.notice = null;
      render();
    } else if (target.dataset.app === "signout") {
      await api("/api/signout", {});
      signedOut();
      render();
    }
  });

  document.addEventListener("submit", (event) => {
    if (event.target.id !== "add-form") return;
    event.preventDefault();
    appSubmit({
      description: document.getElementById("x-description").value,
      amount: document.getElementById("x-amount").value,
      category: document.getElementById("x-category").value,
    });
  });

  document.addEventListener("toggle", (event) => {
    if (event.target.id === "app-menu") app.menuOpen = event.target.open;
    if (event.target.id === "howto") { howtoOpen = event.target.open; save(HOWTO_KEY, howtoOpen); }
    if (event.target.dataset?.box) openBoxes.set(event.target.dataset.box, event.target.open);
  }, true);

  // Back to this page as it was left, mid sign-in.
  window.addEventListener("pageshow", (event) => {
    if (event.persisted && app.signingIn) {
      app.signingIn = false;
      render();
    }
  });

  // Back from connecting the Expenses service in the other tab: look at once.
  window.addEventListener("focus", () => { if (app.connecting) appList({ quiet: true }); });

  // A failed read keeps what the page knew, rather than flashing back to "not done".
  async function loadSetup() {
    const fresh = await api("/api/setup");
    if (fresh.agent) {
      // Switched off, the agent can't learn its id from Hush: keep what the page knew.
      const known = setup?.agent?.hush;
      if (fresh.agent.hush?.disabled && known?.id) {
        fresh.agent.hush = { ...fresh.agent.hush, id: known.id, name: known.name };
        fresh.expenses.assigned = setup.expenses.assigned;
      }
      setup = fresh;
      setupError = null;
    } else {
      setupError = fresh.message || "The agent's page didn't answer.";
    }
  }

  async function start() {
    render();
    // Back from a sign-in Hush refused.
    const params = new URLSearchParams(location.search);
    if (params.has("signin_error")) {
      app.signinError = params.get("signin_error");
      app.signinRefused = true;
      history.replaceState(null, "", location.pathname + location.hash);
    }
    [, me] = await Promise.all([loadSetup(), api("/api/me")]);
    if (me.signed_in === undefined) me = { signed_in: false };
    if (!me.signed_in) {
      app.phase = "signed_out";
      forgetTries();
    }
    render();
    if (me.signed_in && APP_STEPS.includes(STEPS[step].key)) appList();
    refreshFeed();
    setInterval(() => { if (!document.hidden && APP_STEPS.includes(STEPS[step].key)) refreshFeed(); }, FEED_POLL_MS);
    // Hush gets the Expenses service in the background, and the reader
    // registers the agent and assigns it in the Hush UI: show each once done.
    const waiting = () => {
      const key = STEPS[step].key;
      return (setupError && ["welcome", "agent", "access"].includes(key))
        || (["welcome", "access"].includes(key) && inHush().state !== "ready")
        || (key === "agent" && !registered()) || (key === "access" && !assigned())
        || key === "killswitch" || (key === "recap" && agentDisabled());
    };
    setInterval(async () => {
      if (document.hidden || !waiting()) return;
      await loadSetup();
      render();
    }, SETUP_POLL_MS);
  }

  start();
</script>
</body>
</html>
